<!DOCTYPE html>
<html lang="en">
<head>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body, #root { height: 100%; }
body {
  font-family: 'Space Grotesk', sans-serif;
  background: #FEF4F5;
  color: #1A1A18;
  overflow-x: hidden;
}
button:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible,
[tabindex]:focus-visible {
  outline: 3px solid rgba(107,181,232,0.52);
  outline-offset: 3px;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #d0cec9; border-radius: 3px; }

.pixel-bg {
  background-image:
    linear-gradient(rgba(26,26,24,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26,26,24,0.04) 1px, transparent 1px);
  background-size: 24px 24px;
}

@keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
@keyframes scaleIn { from { opacity:0; transform:scale(0.96); } to { opacity:1; transform:scale(1); } }
@keyframes spin { to { transform: rotate(360deg); } }
.fade-in { animation: fadeIn 0.35s ease forwards; }
.scale-in { animation: scaleIn 0.25s ease forwards; }

input[type=range] { appearance: none; height:4px; background:#e8e6e1; border-radius:2px; outline:none; }
input[type=range]::-webkit-slider-thumb { appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent,#F47A8A); cursor:pointer; }

.site-shell {
  min-height: calc(100vh - 60px);
  background:
    radial-gradient(circle at 18% 14%, rgba(244,122,138,0.18), transparent 28%),

}
.site-section {
  max-width: 1180px;
  margin: 0 auto;
  padding: 72px 28px;
}
.hero {
  min-height: calc(100vh - 60px);

  grid-template-columns: minmax(0, 1.02fr) minmax(320px, 0.98fr);

}
.hero h1 {

}
.hero p {

}
.hero-actions,

.btn {

.btn:hover { transform: translateY(-2px); }
.btn-primary {

.bead-orbit {

.hero-strip {

.account-popover {

.mobile-menu-button span::before,

.mobile-menu-button span::after {

.mobile-menu-button span::before { top: -6px; }

<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ─── DESIGN TOKENS ────────────────────────────────────────────────────────────
const T = {
  accentRed: '#F47A8A',
  accentOrange: '#6BB5E8',
  bgColor: '#FEF4F5',
  cardRadius: 8,
};

const AI_ENHANCEMENT_ENABLED = false;
const READY_GRID_IMPORT_MODE = 'ready_grid_codes';
const PHOTO_IMPORT_MODE = 'photo_convert';

// ─── API HELPERS ──────────────────────────────────────────────────────────────
const API_BASE = '/api';

async function apiFetch(path, options = {}) {
  const token = localStorage.getItem('pc_token');
  const headers = {};
  if (token && !path.startsWith('/members/public/')) headers['Authorization'] = `Bearer ${token}`;
  if (options.body && typeof options.body === 'string') {
    headers['Content-Type'] = 'application/json';
  }
  try {
    return await fetch(API_BASE + path, { ...options, headers: { ...headers, ...options.headers } });
  } catch (err) {
    console.error('API error:', err);
    return null;
  }
}

function storeAccountSession(account, token) {
  localStorage.setItem('pc_token', token);
  localStorage.setItem('pc_user', JSON.stringify(account));
  return account;
}

function clearAccountSession() {
  localStorage.removeItem('pc_token');
  localStorage.removeItem('pc_user');

let qrDecoderPromise = null;
async function loadQrDecoder() {
  if (window.jsQR) return window.jsQR;
  if (!qrDecoderPromise) {
    qrDecoderPromise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js';
      script.async = true;
      script.crossOrigin = 'anonymous';
      script.onload = () => window.jsQR ? resolve(window.jsQR) : reject(new Error('QR decoder did not load.'));
      script.onerror = () => reject(new Error('Unable to load QR decoder.'));
      document.head.appendChild(script);
    });
  }
  return qrDecoderPromise;
}

function escapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function safeHexColor(value, fallback = '#E8E6E1') {
  const color = String(value || '').trim();
  return /^#[0-9a-f]{3}([0-9a-f]{3})?$/i.test(color) ? color : fallback;
}

function formatDuration(totalSeconds) {
  const safe = Math.max(0, Math.floor(Number(totalSeconds) || 0));
  const hours = Math.floor(safe / 3600);
  const minutes = Math.floor((safe % 3600) / 60);
  const seconds = safe % 60;
  return [hours, minutes, seconds].map(v => String(v).padStart(2, '0')).join(':');
}

function formatHours(totalSeconds) {
  const safe = Math.max(0, Math.floor(Number(totalSeconds) || 0));
  const hours = Math.floor(safe / 3600);
  const minutes = Math.floor((safe % 3600) / 60);
  if (hours && minutes) return `${hours}h ${minutes}m`;
  if (hours) return `${hours}h`;
  return `${minutes}m`;
}

function formatDateInput(date = new Date()) {
  const year = date.getFullYear();
  const month = String(date.getMonth() + 1).padStart(2, '0');
  const day = String(date.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function formatDateTime(value) {
  if (!value) return '—';
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return '—';
  return date.toLocaleString([], { month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
}

function calculateChargedSeconds(occupiedSeconds) {
  const occupied = Math.max(0, Math.floor(Number(occupiedSeconds) || 0));
  if (occupied === 0) return 0;
  if (occupied <= 3600) return 3600;
  const remaining = occupied - 3600;
  let blocks = Math.floor(remaining / 1800);
  if (remaining % 1800 > 600) blocks += 1;
  return 3600 + blocks * 1800;
}

function parseDurationInput(value) {
  const raw = String(value || '').trim();
  if (!raw) return 0;
  if (/^\d+$/.test(raw)) return Number(raw);
  const parts = raw.split(':').map(v => Number(v));
  if (parts.some(v => !Number.isFinite(v) || v < 0)) return 0;
  if (parts.length === 3) return parts[0] * 3600 + parts[1] * 60 + parts[2];
  if (parts.length === 2) return parts[0] * 60 + parts[1];
  return 0;
}

function PixelGridPreview({ color, w, h, gridData, palette }) {
  const ref = useRef();
  const size = 160;
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    const hasGrid = Array.isArray(gridData) && gridData.length > 0 && Array.isArray(gridData[0]);
    const rows = hasGrid ? gridData.length : h;
    const cols = hasGrid ? gridData[0].length : w;
    const drawRows = rows;
    const drawCols = cols;
    const cell = size / Math.max(drawRows, drawCols);
    const offsetX = (size - drawCols * cell) / 2;
    const offsetY = (size - drawRows * cell) / 2;

    if (hasGrid) {
      const paletteById = new Map((palette || []).map(c => [c.id, c.hex]));
      ctx.fillStyle = '#f0ede8';
      ctx.fillRect(offsetX, offsetY, drawCols * cell, drawRows * cell);
      for (let y = 0; y < drawRows; y++) {
        for (let x = 0; x < drawCols; x++) {
          const beadId = gridData[y]?.[x];
          if (beadId) {
            ctx.fillStyle = paletteById.get(beadId) || color || '#CC2936';
            ctx.fillRect(offsetX + x * cell + 0.5, offsetY + y * cell + 0.5, Math.max(cell - 1, 1), Math.max(cell - 1, 1));
          }
        }
      }
      return;
    }

    const cw = size/Math.min(w,20), ch = size/Math.min(h,20);
    for (let y = 0; y < Math.min(h,20); y++) {
      for (let x = 0; x < Math.min(w,20); x++) {
        const v = (Math.sin(x*1.1+y*0.9)*0.5+0.5);
        ctx.fillStyle = v > 0.6 ? color : v > 0.35 ? `${color}88` : '#f0ede8';
        ctx.fillRect(x*cw+0.5, y*ch+0.5, cw-1, ch-1);
      }
    }
  }, [color, w, h, gridData, palette]);
  return <canvas ref={ref} width={size} height={size} style={{imageRendering:'pixelated',opacity:0.9}}/>;
}

// ─── REAL CONVERSION PREVIEW ──────────────────────────────────────────────────
function ConversionPreview({ result, maxSize = 160 }) {
  const ref = useRef();
  useEffect(() => {
    if (!result || !ref.current) return;
    const { rows, cols, cells } = result;
    if (!rows || !cols || !cells) return;
    const canvas = ref.current;
    canvas.width = cols;
    canvas.height = rows;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#f0ede8';
    ctx.fillRect(0, 0, cols, rows);
    for (const cell of cells) {
      if (!cell.empty) {
        ctx.fillStyle = cell.color_hex;
        ctx.fillRect(cell.col - 1, cell.row - 1, 1, 1);
      }
    }
  }, [result]);
  if (!result) return null;
  const { rows = 1, cols = 1 } = result;
  const scale = Math.min(maxSize / cols, maxSize / rows);
  return <canvas ref={ref} style={{width:Math.round(cols*scale),height:Math.round(rows*scale),imageRendering:'pixelated',borderRadius:6,display:'block'}}/>;
}

// ─── GALLERY PAGE ─────────────────────────────────────────────────────────────
function GalleryPage({ patterns, loading, favIds, onFave, onOpen, user, onPatternDeleted }) {
  const [search, setSearch] = useState('');
  const [sizeFilter, setSizeFilter] = useState('All');
  const isLoggedIn = !!user;
  const isAdmin = !!user?.is_admin;

  const filtered = patterns.filter(p => {
    const matchSearch = !search ||
      p.title.toLowerCase().includes(search.toLowerCase()) ||
      (p.tags||[]).some(t => t.toLowerCase().includes(search.toLowerCase()));
    const matchSize = sizeFilter === 'All' || p.size === sizeFilter;
    return matchSearch && matchSize;

  return (
    <div className="page-shell gallery-page pixel-bg" style={{minHeight:'calc(100vh - 60px)',padding:'40px 40px'}}>

          Discover <span style={{color:T.accentRed}}>Bead Patterns</span>
        </h1>
        <p style={{color:'#888',fontSize:15}}>Convert your favorite images into beautiful pixel bead art</p>
      </div>
      <div className="library-toolbar" style={{display:'flex',gap:12,marginBottom:32,flexWrap:'wrap',alignItems:'center'}}>
        <div style={{display:'flex',alignItems:'center',gap:10,background:'#fff',border:'2px solid #e8e6e1',borderRadius:12,padding:'10px 16px',flex:1,maxWidth:400,transition:'border-color 0.15s'}}>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#999" strokeWidth="2.5">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
          </svg>
          <input value={search} onChange={e=>setSearch(e.target.value)}
            placeholder="Search patterns… e.g. Mario, Flower"
            style={{border:'none',outline:'none',fontSize:14,background:'transparent',width:'100%',fontFamily:'inherit',color:'#1A1A18'}}/>
          {search && <button onClick={()=>setSearch('')} aria-label="Clear pattern search" style={{background:'none',border:'none',cursor:'pointer',color:'#777',fontSize:16,lineHeight:1}}>×</button>}
        </div>
        <div className="filter-chips" style={{display:'flex',gap:6}}>
          {['All','Small','Medium','Large'].map(s => (
            <button key={s} onClick={()=>setSizeFilter(s)} style={{
              background: sizeFilter===s ? T.accentRed : '#fff',
              color: sizeFilter===s ? '#fff' : '#666',
              border: `2px solid ${sizeFilter===s ? T.accentRed : '#e8e6e1'}`,
              borderRadius:8,padding:'8px 16px',fontWeight:600,fontSize:13,cursor:'pointer',fontFamily:'inherit',transition:'all 0.15s'
            }}>{s}</button>
          ))}
        </div>
        <span style={{fontSize:13,color:'#999',marginLeft:'auto'}}>
          {loading
            ? <Spinner size={14}/>

          }
        </span>
      </div>
      <div className="pattern-grid" style={{display:'grid',gridTemplateColumns:'repeat(auto-fill, minmax(240px, 1fr))',gap:20}}>
        {filtered.map(p => (
          <div key={p.id} className="fade-in">
            <PatternCard pattern={p} onOpen={onOpen} isFaved={favIds.has(p.id)} onFave={onFave} isLoggedIn={isLoggedIn} isAdmin={isAdmin} onDelete={onPatternDeleted}/>

            <div style={{fontSize:48,marginBottom:12}}>🔍</div>

}

// ─── BEAD MAP VIEWER ──────────────────────────────────────────────────────────
function BeadMapViewer({ pattern, onClose, user, notify }) {
  const isLoggedIn = !!user;
  const isAdmin = !!user?.is_admin;
  const [crossed, setCrossed] = useState(new Set());
  const [zoom, setZoom] = useState(1);
  const [highlight, setHighlight] = useState(null);
  const gridData = pattern.grid_data || generateGrid(pattern.gridW, pattern.gridH, pattern.palette);
  const cellSize = Math.min(Math.floor(460 / pattern.gridW), 24);
  const palette = pattern.palette || [];

  useEffect(() => {
    const closeOnEscape = event => {
      if (event.key === 'Escape') onClose();
    };
    document.addEventListener('keydown', closeOnEscape);
    return () => document.removeEventListener('keydown', closeOnEscape);
  }, [onClose]);

  const toggle = (key) => {
    if (!isLoggedIn) return;
    setCrossed(prev => {
      const next = new Set(prev);
      next.has(key) ? next.delete(key) : next.add(key);
      return next;
    });
  };

  const resetProgress = () => {
    if (!window.confirm('Reset all progress for this pattern?')) return;
    setCrossed(new Set());
    notify('Progress reset.', 'success');
  };

  const usedColors = {};
  gridData.flat().forEach(id => { if (id) usedColors[id] = (usedColors[id]||0)+1; });
  const totalBeads = pattern.gridW * pattern.gridH;
  const doneBeads = crossed.size;
  const paletteById = new Map(palette.map(bead => [bead.id, bead]));

  const buildGridRowsHtml = (size, showLabels = false) => gridData.map((row, y) => (
    `<div class="grid-row">${row.map((beadId, x) => {
      const bead = paletteById.get(beadId) || {id: beadId, name: beadId, hex: '#e0e0e0'};
      const empty = !beadId;
      const label = showLabels && beadId ? escapeHtml(beadId) : '';
      return `<div class="grid-cell${empty ? ' empty' : ''}" title="${escapeHtml(`${x + 1},${y + 1} ${bead.name || beadId || 'Empty'}`)}" style="width:${size}px;height:${size}px;background:${empty ? '#F8F7F4' : safeHexColor(bead.hex)}">${label}</div>`;
    }).join('')}</div>`
  )).join('');

  const buildLegendHtml = () => Object.entries(usedColors).map(([id, count]) => {
    const bead = paletteById.get(id) || {id, name:id, hex:'#e0e0e0'};
    return `<div class="legend-item"><span class="swatch" style="background:${safeHexColor(bead.hex)}"></span><span><strong>${escapeHtml(bead.name || id)}</strong><small>${escapeHtml(id)} · ${count} beads</small></span></div>`;
  }).join('');

  const openGridFullscreenTab = () => {
    const fullscreenWindow = window.open('', '_blank');
    if (!fullscreenWindow) {
      notify('Please allow pop-ups to open the fullscreen grid.', 'error');
      return;
    }
    fullscreenWindow.opener = null;
    fullscreenWindow.document.write(`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>${escapeHtml(pattern.title)} fullscreen grid</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:'Space Grotesk',sans-serif;background:#171716;color:#fff;overflow:hidden}.toolbar{position:fixed;top:0;left:0;right:0;height:58px;background:rgba(26,26,24,.94);border-bottom:1px solid rgba(255,255,255,.12);display:flex;align-items:center;gap:10px;padding:0 18px;z-index:2}.title{min-width:0;flex:1}.title strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.title span{display:block;font:700 11px 'Space Mono',monospace;color:#aaa;margin-top:2px}.toolbar button{border:1px solid rgba(255,255,255,.18);background:#242423;color:#fff;border-radius:8px;padding:8px 12px;font:700 12px 'Space Grotesk',sans-serif;cursor:pointer}.toolbar button:hover{border-color:#F47A8A;color:#F47A8A}.viewport{position:fixed;inset:58px 0 0;overflow:hidden;cursor:grab;touch-action:none}.viewport.dragging{cursor:grabbing}.stage{position:absolute;left:0;top:0;transform-origin:0 0}.grid{display:inline-block;background:#fff;border:1px solid rgba(255,255,255,.2);box-shadow:0 20px 70px rgba(0,0,0,.35)}.grid-row{display:flex}.grid-cell{flex:0 0 auto;border:.5px solid rgba(0,0,0,.1);font:700 9px 'Space Mono',monospace;color:rgba(0,0,0,.62);display:flex;align-items:center;justify-content:center;overflow:hidden}.grid-cell.empty{background:#f8f7f4}.hint{color:#bdbdb8;font-size:12px;margin-left:6px}@media(max-width:640px){.toolbar{height:auto;min-height:58px;flex-wrap:wrap;padding:10px}.viewport{inset:78px 0 0}.hint{display:none}}
</style>
</head>
<body>
<div class="toolbar">
  <div class="title"><strong>${escapeHtml(pattern.title)}</strong><span>${pattern.gridW}x${pattern.gridH} beads · ${Object.keys(usedColors).length} colors</span></div>
  <button type="button" data-action="zoom-out">Zoom -</button>
  <button type="button" data-action="zoom-in">Zoom +</button>
  <button type="button" data-action="reset">Reset</button>
  <button type="button" data-action="close">Close</button>
  <span class="hint">Drag to pan. Scroll to zoom.</span>
</div>
<div class="viewport">
  <div class="stage">
    <div class="grid">${buildGridRowsHtml(18, pattern.gridW <= 60 && pattern.gridH <= 60)}</div>
  </div>
</div>
<script>
const viewport = document.querySelector('.viewport');
const stage = document.querySelector('.stage');
let scale = 1;
let originX = 0;
let originY = 0;
let startX = 0;
let startY = 0;
let isDragging = false;
function render(){ stage.style.transform = 'translate(' + originX + 'px,' + originY + 'px) scale(' + scale + ')'; }
function centerGrid(){ const box = stage.getBoundingClientRect(); originX = Math.max(24, (viewport.clientWidth - box.width) / 2); originY = Math.max(24, (viewport.clientHeight - box.height) / 2); render(); }
function zoomBy(delta, clientX = viewport.clientWidth / 2, clientY = viewport.clientHeight / 2){ const next = Math.min(5, Math.max(0.25, scale + delta)); const rect = viewport.getBoundingClientRect(); const px = clientX - rect.left - originX; const py = clientY - rect.top - originY; originX -= px * (next / scale - 1); originY -= py * (next / scale - 1); scale = next; render(); }
document.querySelector('[data-action="zoom-in"]').addEventListener('click', () => zoomBy(0.25));
document.querySelector('[data-action="zoom-out"]').addEventListener('click', () => zoomBy(-0.25));
document.querySelector('[data-action="reset"]').addEventListener('click', () => { scale = 1; centerGrid(); });
document.querySelector('[data-action="close"]').addEventListener('click', () => window.close());
viewport.addEventListener('wheel', event => { event.preventDefault(); zoomBy(event.deltaY < 0 ? 0.15 : -0.15, event.clientX, event.clientY); }, {passive:false});
viewport.addEventListener('pointerdown', event => { isDragging = true; viewport.classList.add('dragging'); startX = event.clientX - originX; startY = event.clientY - originY; viewport.setPointerCapture(event.pointerId); });
viewport.addEventListener('pointermove', event => { if (!isDragging) return; originX = event.clientX - startX; originY = event.clientY - startY; render(); });
viewport.addEventListener('pointerup', event => { isDragging = false; viewport.classList.remove('dragging'); viewport.releasePointerCapture(event.pointerId); });
window.addEventListener('resize', centerGrid);
requestAnimationFrame(centerGrid);
</scr` + `ipt>
</body>
</html>`);
    fullscreenWindow.document.close();
  };

  const downloadPatternPdf = () => {
    const pdfWindow = window.open('', '_blank');
    if (!pdfWindow) {
      notify('Please allow pop-ups to generate the PDF.', 'error');
      return;
    }
    pdfWindow.opener = null;
    pdfWindow.document.write(`<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>${escapeHtml(pattern.title)} bead grid</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box}body{font-family:'Space Grotesk',sans-serif;color:#1A1A18;margin:28px;background:#fff}header{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:18px;border-bottom:2px solid #E8E6E1;padding-bottom:14px}h1{font-size:26px;line-height:1.1;margin:0 0 6px;font-weight:800}.meta{font:700 12px 'Space Mono',monospace;color:#777}.grid-wrap{overflow:visible;margin:18px 0}.grid{display:inline-block;border:1px solid #777;break-inside:avoid}.grid-row{display:flex}.grid-cell{width:10px;height:10px;flex:0 0 auto;border:.4px solid rgba(0,0,0,.16);font:700 5px 'Space Mono',monospace;color:rgba(0,0,0,.58);display:flex;align-items:center;justify-content:center;overflow:hidden}.legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px 14px;margin-top:18px}.legend-item{display:flex;align-items:center;gap:8px;break-inside:avoid}.swatch{width:18px;height:18px;border:1px solid rgba(0,0,0,.18);border-radius:4px;flex:0 0 auto}.legend-item strong{display:block;font-size:12px;line-height:1.1}.legend-item small{display:block;font:700 10px 'Space Mono',monospace;color:#777;margin-top:2px}@page{size:auto;margin:12mm}@media print{body{margin:0}.no-print{display:none}.grid-cell{print-color-adjust:exact;-webkit-print-color-adjust:exact}.swatch{print-color-adjust:exact;-webkit-print-color-adjust:exact}}
</style>
</head>
<body>
<header>
  <div><h1>${escapeHtml(pattern.title)}</h1><div class="meta">${pattern.gridW}x${pattern.gridH} beads · ${totalBeads} total beads · ${Object.keys(usedColors).length} colors</div></div>
  <button class="no-print" onclick="window.print()" style="border:0;border-radius:8px;background:#F47A8A;color:#fff;padding:10px 14px;font-weight:800;font-family:'Space Grotesk',sans-serif;cursor:pointer">Print / Save PDF</button>
</header>
<main>
  <div class="grid-wrap"><div class="grid">${buildGridRowsHtml(10, pattern.gridW <= 80 && pattern.gridH <= 80)}</div></div>
  <section class="legend">${buildLegendHtml()}</section>
</main>
</body>
</html>`);
    pdfWindow.document.close();
    setTimeout(() => {
      pdfWindow.focus();
      pdfWindow.print();
    }, 250);
  };

  return (
    <div className="viewer-overlay" onClick={onClose}>
      <div className="viewer-modal scale-in" role="dialog" aria-modal="true" aria-labelledby="viewer-title" onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div className="viewer-header">
          <div style={{flex:1}}>
            <h2 id="viewer-title" style={{fontSize:20,fontWeight:800,letterSpacing:'-0.02em'}}>{pattern.title}</h2>
            <div style={{fontSize:12,color:'#999',marginTop:2,fontFamily:'Space Mono,monospace'}}>
              {pattern.gridW}×{pattern.gridH} beads · {Object.keys(usedColors).length} colors
              {isLoggedIn && ` · ${doneBeads}/${totalBeads} placed`}
            </div>
          </div>
          {isLoggedIn && (
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:11,color:'#999',marginBottom:4,letterSpacing:'.06em',textTransform:'uppercase'}}>Progress</div>
              <div style={{width:120,height:6,background:'#f0ede8',borderRadius:3,overflow:'hidden'}}>
                <div style={{width:`${(doneBeads/totalBeads)*100}%`,height:'100%',background:`linear-gradient(90deg, ${T.accentRed}, ${T.accentOrange})`,transition:'width 0.3s'}}/>
              </div>
              <div style={{fontSize:11,color:T.accentRed,marginTop:3,fontWeight:700}}>{Math.round((doneBeads/totalBeads)*100)}%</div>
            </div>
          )}
          <div style={{display:'flex',gap:4}}>
            {[0.75,1,1.5,2].map(z=>(

            ))}

          <button onClick={onClose} aria-label="Close pattern viewer" style={{background:'#f2f1ee',border:'none',borderRadius:8,width:34,height:34,cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#555'}}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
        </div>

        <div className="viewer-body">

                <span>Sign in to track your progress and cross off placed beads</span>
              </div>
            )}

              {gridData.map((row, y) => (
                <div key={y} style={{display:'flex'}}>
                  {row.map((beadId, x) => {
                    const bead = palette.find(b=>b.id===beadId) || {id:beadId,name:beadId,hex:'#e0e0e0'};
                    const key = `${x},${y}`;
                    const done = crossed.has(key);
                    const isHighlighted = highlight === beadId;
                    return (
                      <div key={x}
                        onClick={() => toggle(key)}
                        onMouseEnter={() => setHighlight(beadId)}

// ─── TIME TABLE PAGE ─────────────────────────────────────────────────────────
function TimeTablePage({ user }) {
  const isAdmin = !!user?.is_admin;
  const [tables, setTables] = useState([]);
  const [loading, setLoading] = useState(true);
  const [lastLoadedAt, setLastLoadedAt] = useState(Date.now());
  const [tick, setTick] = useState(Date.now());
  const [selectedTable, setSelectedTable] = useState(() => {
    const number = Number(new URLSearchParams(window.location.search).get('table'));
    return Number.isInteger(number) && number >= 1 && number <= 14 ? number : null;
  });
  const [setValues, setSetValues] = useState({});
  const [savingTable, setSavingTable] = useState(null);
  const [message, setMessage] = useState('');
  const [reportDate, setReportDate] = useState(formatDateInput());
  const [report, setReport] = useState({ summary:{sessions:0, occupied_seconds:0, charged_seconds:0}, daily_report:[], logs:[] });
  const [reportLoading, setReportLoading] = useState(false);

  const buildTableLink = (tableNumber) => `${window.location.origin}${window.location.pathname}?page=timetable&table=${tableNumber}`;

  const loadTables = useCallback(async () => {
    try {
      const res = await apiFetch('/timetable');
      const data = res?.ok ? await res.json() : null;
      if (Array.isArray(data)) {
        setTables(data);
        setLastLoadedAt(Date.now());
        setSetValues(prev => {
          const next = { ...prev };
          data.forEach(table => {
            if (next[table.table_number] == null) next[table.table_number] = formatDuration(table.elapsed_seconds);
          });
          return next;
        });
      }
    } finally {
      setLoading(false);
    }
  }, []);

  const loadReport = useCallback(async () => {
    if (!isAdmin) {
      setReport({ summary:{sessions:0, occupied_seconds:0, charged_seconds:0}, daily_report:[], logs:[] });
      return;
    }
    setReportLoading(true);
    try {
      const res = await apiFetch(`/timetable/report?date=${reportDate}`);
      const data = res?.ok ? await res.json() : null;
      if (data) setReport(data);
    } finally {
      setReportLoading(false);
    }
  }, [isAdmin, reportDate]);

  useEffect(() => {
    loadTables();
    const refresh = setInterval(loadTables, 5000);
    return () => clearInterval(refresh);
  }, [loadTables]);

  useEffect(() => {
    loadReport();
  }, [loadReport]);

  useEffect(() => {
    const clock = setInterval(() => setTick(Date.now()), 1000);
    return () => clearInterval(clock);
  }, []);

  const liveElapsed = (table) => {
    const base = Number(table.elapsed_seconds) || 0;
    if (!table.is_running) return base;
    return base + Math.max(0, Math.floor((tick - lastLoadedAt) / 1000));
  };

  const runTableAction = async (tableNumber, action) => {
    if (action === 'reset' && !window.confirm(`Reset Table #${tableNumber} timer? This will clear the current time.`)) {
      return;
    }
    setSavingTable(tableNumber);
    setMessage('');
    try {
      const res = await apiFetch(`/timetable/${tableNumber}/${action}`, { method: 'POST' });
      if (!res?.ok) {
        setMessage('Unable to update table status.');
        return;
      }
      await loadTables();
      if (action !== 'start') await loadReport();
    } finally {
      setSavingTable(null);
    }
  };

  async function resetAllTables() {
    if (!window.confirm('Reset all table timers? This will clear every table timer.')) {
      return;
    }
    setSavingTable('all');
    setMessage('');
    try {
      const res = await apiFetch('/timetable/reset-all', { method: 'POST' });
      if (!res?.ok) {
        setMessage('Unable to reset all table timers.');
        return;
      }
      await loadTables();
      await loadReport();
      setMessage('All table timers reset.');
    } finally {
      setSavingTable(null);
    }
  }

  const setTableTime = async (table) => {
    const tableNumber = table.table_number;
    setSavingTable(tableNumber);
    setMessage('');
    try {
      const elapsedSeconds = parseDurationInput(setValues[tableNumber] || formatDuration(liveElapsed(table)));
      const res = await apiFetch(`/timetable/${tableNumber}`, {
        method: 'PUT',
        body: JSON.stringify({ elapsed_seconds: elapsedSeconds, is_running: table.is_running }),
      });
      if (!res?.ok) {
        setMessage('Use seconds or HH:MM:SS for table time.');
        return;
      }
      await loadTables();
    } finally {
      setSavingTable(null);
    }
  };

  const openTableLink = (tableNumber) => {
    setSelectedTable(tableNumber);
    window.history.replaceState(null, '', `?page=timetable&table=${tableNumber}`);
  };

  const clearIndividualTable = () => {
    setSelectedTable(null);
    window.history.replaceState(null, '', '?page=timetable');
  };

  const copyTableLink = async (tableNumber) => {
    const link = buildTableLink(tableNumber);
    openTableLink(tableNumber);
    try {
      await navigator.clipboard.writeText(link);
      setMessage(`Table ${tableNumber} link copied.`);
    } catch (err) {
      setMessage(link);
    }
  };

  const tableSlots = tables.length
    ? tables
    : Array.from({length: 14}, (_, index) => ({
      table_number: index + 1,
      status: 'Free',
      is_running: false,
      elapsed_seconds: 0,
    }));

  const isIndividualTablePage = selectedTable != null;
  const visibleTableSlots = isIndividualTablePage
    ? tableSlots.filter(table => table.table_number === selectedTable)
    : tableSlots;
  const occupiedCount = tableSlots.filter(table => table.is_running).length;
  const reportSummary = report?.summary || { sessions:0, occupied_seconds:0, charged_seconds:0 };
  const dailyRows = report?.daily_report || [];
  const timeLogs = report?.logs || [];

  return (
    <div className="page-shell pixel-bg" style={{minHeight:'calc(100vh - 60px)',padding:'40px 40px'}}>
      <div className="page-inner">
      <div className="page-header" style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:24,marginBottom:28,flexWrap:'wrap'}}>
        <div>
          <h1 style={{fontSize:36,fontWeight:800,letterSpacing:'-0.03em',marginBottom:8}}>
            {isIndividualTablePage ? <>Table <span style={{color:T.accentRed}}>#{selectedTable}</span></> : <>Time <span style={{color:T.accentRed}}>Table</span></>}
          </h1>
          <p style={{color:'#888',fontSize:15}}>
            {isIndividualTablePage ? `Only Table ${selectedTable} stopwatch is shown on this individual page.` : 'Check which bead tables are free and follow each table stopwatch.'}
          </p>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
          {!isIndividualTablePage && (
            <div style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:'10px 14px'}}>
              <div style={{fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',color:'#aaa',fontWeight:700}}>Occupied</div>
              <div style={{fontFamily:'Space Mono,monospace',fontWeight:700,fontSize:20,color:T.accentRed}}>{occupiedCount}/14</div>
            </div>
          )}
          {isIndividualTablePage && (
            <button onClick={clearIndividualTable} style={{background:'#fff',color:'#555',border:'1px solid #E8E6E1',borderRadius:8,padding:'10px 14px',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>
              All Tables
            </button>
          )}
          <button onClick={loadTables} style={{background:'#fff',color:'#555',border:'1px solid #E8E6E1',borderRadius:8,padding:'10px 14px',fontWeight:700,fontSize:13,cursor:'pointer',fontFamily:'inherit'}}>
            {loading ? 'Loading...' : 'Refresh'}
          </button>
          {isAdmin && (
            <button onClick={resetAllTables} disabled={savingTable === 'all'} style={{background:savingTable === 'all'?'#e8e6e1':T.accentRed,color:savingTable === 'all'?'#aaa':'#fff',border:'none',borderRadius:8,padding:'10px 14px',fontWeight:800,fontSize:13,cursor:savingTable === 'all'?'default':'pointer',fontFamily:'inherit'}}>
              {savingTable === 'all' ? 'Resetting...' : 'Reset All Timers'}
            </button>
          )}
        </div>
      </div>

      {message && (
        <div style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:'10px 14px',marginBottom:18,color:'#666',fontSize:13,fontWeight:600,overflowWrap:'anywhere'}}>
          {message}
        </div>
      )}

      <div style={{display:'grid',gridTemplateColumns:isIndividualTablePage?'minmax(260px, 420px)':'repeat(auto-fill, minmax(260px, 1fr))',gap:18}}>
        {visibleTableSlots.map(table => {
          const elapsed = liveElapsed(table);
          const active = selectedTable === table.table_number;
          const saving = savingTable === table.table_number;
          return (
            <article key={table.table_number} className="fade-in" style={{
              background:'#fff',
              border:`2px solid ${active ? T.accentRed : '#E8E6E1'}`,
              borderRadius:8,
              padding:20,
              boxShadow:active?'0 12px 30px rgba(244,122,138,0.16)':'0 4px 18px rgba(26,26,24,0.05)'
            }}>
              <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'flex-start',marginBottom:18}}>
                <div>
                  <div style={{fontSize:11,letterSpacing:'.08em',textTransform:'uppercase',color:'#aaa',fontWeight:700,marginBottom:5}}>Table</div>
                  <h2 style={{fontSize:28,fontWeight:800,lineHeight:1}}>#{table.table_number}</h2>
                </div>
                <span style={{
                  background:table.is_running?`${T.accentRed}18`:'#ECFDF5',
                  color:table.is_running?T.accentRed:'#047857',
                  border:`1px solid ${table.is_running?`${T.accentRed}45`:'#A7F3D0'}`,
                  borderRadius:20,
                  padding:'5px 10px',
                  fontSize:11,
                  fontWeight:800,
                  letterSpacing:'.04em',
                  textTransform:'uppercase'
                }}>{table.status}</span>
              </div>

              <div style={{marginBottom:18}}>
                <div style={{fontFamily:'Space Mono,monospace',fontWeight:700,fontSize:34,letterSpacing:'0',color:'#1A1A18'}}>
                  {formatDuration(elapsed)}
                </div>
                <div style={{display:'flex',gap:10,flexWrap:'wrap',marginTop:8}}>
                  <span style={{fontSize:12,color:'#777',fontWeight:700}}>Occupied {formatDuration(elapsed)}</span>
                  <span style={{fontSize:12,color:T.accentRed,fontWeight:800}}>Charging {formatDuration(calculateChargedSeconds(elapsed))}</span>
                </div>
                {table.active_member && (
                  <div style={{marginTop:12,background:`${T.accentOrange}10`,border:`1px solid ${T.accentOrange}35`,borderRadius:8,padding:'10px 12px'}}>
                    <div style={{fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',color:'#7A94A8',fontWeight:800,marginBottom:4}}>Checked-in member</div>
                    <div style={{fontWeight:800,color:'#1A1A18'}}>{table.active_member.name}</div>
                    <div style={{fontFamily:'Space Mono,monospace',fontSize:12,color:'#666',marginTop:2}}>{table.active_member.member_code} · {formatHours(table.active_member.remaining_seconds)} left</div>
                  </div>
                )}
              </div>

              <div style={{display:'flex',gap:8,marginBottom:isAdmin?16:0}}>
                <a href={buildTableLink(table.table_number)} onClick={e => { e.preventDefault(); openTableLink(table.table_number); }} style={{
                  flex:1,
                  textAlign:'center',
                  textDecoration:'none',
                  background:'#f8f7f4',
                  color:'#555',
                  border:'1px solid #E8E6E1',
                  borderRadius:8,
                  padding:'9px 10px',
                  fontWeight:700,
                  fontSize:13
                }}>Open Link</a>
                <button onClick={() => copyTableLink(table.table_number)} style={{
                  flex:1,
                  background:'#fff',
                  color:T.accentRed,
                  border:`1px solid ${T.accentRed}`,
                  borderRadius:8,
                  padding:'9px 10px',
                  fontWeight:700,
                  fontSize:13,
                  cursor:'pointer',
                  fontFamily:'inherit'
                }}>Copy Link</button>
              </div>

              {isAdmin && (
                <div style={{borderTop:'1px solid #F0EDEA',paddingTop:16}}>
                  <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:8,marginBottom:10}}>
                    <button onClick={() => runTableAction(table.table_number, 'start')} disabled={saving || table.is_running} style={{
                      background:table.is_running?'#e8e6e1':T.accentRed,
                      color:table.is_running?'#aaa':'#fff',
                      border:'none',
                      borderRadius:8,
                      padding:'9px 0',
                      fontWeight:800,
                      fontSize:12,
                      cursor:(saving || table.is_running)?'default':'pointer',
                      fontFamily:'inherit'
                    }}>Start</button>
                    <button onClick={() => runTableAction(table.table_number, 'stop')} disabled={saving || !table.is_running} style={{
                      background:!table.is_running?'#e8e6e1':T.accentOrange,
                      color:!table.is_running?'#aaa':'#fff',
                      border:'none',
                      borderRadius:8,
                      padding:'9px 0',
                      fontWeight:800,
                      fontSize:12,
                      cursor:(saving || !table.is_running)?'default':'pointer',
                      fontFamily:'inherit'
                    }}>Stop</button>
                    <button onClick={() => runTableAction(table.table_number, 'reset')} disabled={saving} style={{
                      background:'#f2f1ee',
                      color:'#555',
                      border:'none',
                      borderRadius:8,
                      padding:'9px 0',
                      fontWeight:800,
                      fontSize:12,
                      cursor:saving?'default':'pointer',
                      fontFamily:'inherit'
                    }}>Reset</button>
                  </div>
                  <div style={{display:'flex',gap:8}}>
                    <input value={setValues[table.table_number] || ''} onChange={e=>setSetValues(prev => ({...prev, [table.table_number]: e.target.value}))} placeholder="HH:MM:SS" style={{
                      minWidth:0,
                      flex:1,
                      border:'1px solid #E8E6E1',
                      borderRadius:8,
                      padding:'9px 10px',
                      fontFamily:'Space Mono,monospace',
                      fontSize:12,
                      outline:'none'
                    }}/>
                    <button onClick={() => setTableTime(table)} disabled={saving} style={{
                      background:'#1A1A18',
                      color:'#fff',
                      border:'none',
                      borderRadius:8,
                      padding:'9px 12px',
                      fontWeight:800,
                      fontSize:12,
                      cursor:saving?'default':'pointer',
                      fontFamily:'inherit'
                    }}>{saving ? 'Saving' : 'Set'}</button>
                  </div>
                </div>
              )}
            </article>
          );
        })}
      </div>

      {isAdmin && (
      <section style={{marginTop:28,display:'grid',gap:18}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:14,flexWrap:'wrap'}}>
          <div>
            <h2 style={{fontSize:24,fontWeight:800,marginBottom:4}}>Daily Report</h2>
            <p style={{fontSize:13,color:'#888'}}>Saved database logs for completed table sessions.</p>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center'}}>
            <input type="date" value={reportDate} onChange={e=>setReportDate(e.target.value || formatDateInput())} style={{
              border:'1px solid #E8E6E1',
              borderRadius:8,
              padding:'9px 10px',
              fontFamily:'Space Mono,monospace',
              fontSize:12,
              outline:'none'
            }}/>
            <button onClick={loadReport} style={{
              background:'#fff',
              color:'#555',
              border:'1px solid #E8E6E1',
              borderRadius:8,
              padding:'9px 12px',
              fontWeight:800,
              fontSize:12,
              cursor:'pointer',
              fontFamily:'inherit'
            }}>{reportLoading ? 'Loading' : 'Refresh'}</button>
          </div>
        </div>

        <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(180px, 1fr))',gap:12}}>
          {[
            ['Sessions', reportSummary.sessions || 0],

            ['Charging Time', formatDuration(reportSummary.charged_seconds)],

                  <div>
                    <div style={{fontSize:10,color:'#aaa',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:800}}>Charging</div>
                    <div style={{fontFamily:'Space Mono,monospace',fontSize:13,fontWeight:700,color:T.accentRed}}>{formatDuration(row.charged_seconds)}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>

          <div style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:18,overflow:'hidden'}}>
            <div style={{fontSize:14,fontWeight:800,marginBottom:12}}>Time Log</div>
            <div style={{display:'grid',gap:8,maxHeight:360,overflow:'auto',paddingRight:4}}>

                <div key={log.id} style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(92px, 1fr))',gap:10,alignItems:'center',borderTop:'1px solid #F0EDEA',paddingTop:10}}>

                  </div>

                    <div style={{fontSize:10,color:'#aaa',textTransform:'uppercase',letterSpacing:'.06em',fontWeight:800}}>Occupied</div>

                    <div style={{fontFamily:'Space Mono,monospace',fontSize:12,fontWeight:700,color:T.accentRed}}>{formatDuration(log.charged_seconds)}</div>
                    {log.extra_due_seconds > 0 && <div style={{fontSize:11,color:'#B45309',fontWeight:800}}>Due {formatDuration(log.extra_due_seconds)}</div>}
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </section>
      )}
      </div>
    </div>
  );
}

  const aiEnhancingRef = useRef(new Set());
  const [publishTitle, setPublishTitle] = useState('');
  const [publishTags, setPublishTags] = useState('');
  const [publishSize, setPublishSize] = useState('Medium');
  const [publishing, setPublishing] = useState(false);
  const [isGridImage, setIsGridImage] = useState(false);
  const [stats, setStats] = useState(null);
  const [error, setError] = useState('');
  const [editorStatus, setEditorStatus] = useState('');
  const fileInputRef = useRef();
  const editorResultTimestampRef = useRef(0);

  const resetFileInput = () => {
    if (fileInputRef.current) fileInputRef.current.value = '';
  };

  const fileToDataUrl = (file) => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = () => reject(reader.error || new Error('Unable to read image'));
    reader.readAsDataURL(file);
  });

  const dataUrlToFile = (dataUrl, filename) => {
    const [header, data] = dataUrl.split(',');
    const mime = (header.match(/data:([^;]+)/) || [])[1] || 'image/png';
    const binary = atob(data);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new File([bytes], filename, { type: mime });
  };

  const isCsvFile = (file) => {
    const name = (file?.name || '').toLowerCase();
    const type = (file?.type || '').toLowerCase();
    return name.endsWith('.csv') || ['text/csv', 'application/csv', 'application/vnd.ms-excel', 'text/plain'].includes(type);
  };

  const handleFileSelect = async (file) => {
    if (!file) return;
    const csvFile = isCsvFile(file);
    if (!csvFile && !file.type?.startsWith('image/')) {
      setError('Please choose a JPG, PNG, WEBP image or CSV bead pattern');
      resetFileInput();
      return;
    }
    if (!csvFile && file.size > 20 * 1024 * 1024) {
      setError('Image must be 20 MB or smaller');
      resetFileInput();
      return;
    }
    if (csvFile && file.size > 5 * 1024 * 1024) {
      setError('CSV must be 5 MB or smaller');
      resetFileInput();
      return;
    }
    localStorage.removeItem('pixelcraft_admin_draft');
    localStorage.removeItem('pixelcraft_editor_payload');
    localStorage.removeItem('pixelcraft_editor_result');
    try {
      const sourceImageDataUrl = csvFile ? null : await fileToDataUrl(file);
      setUploaded({
        name: file.name,
        size: `${(file.size / 1024 / 1024).toFixed(1)} MB`,
        file,
        sourceImageDataUrl,
        kind: csvFile ? 'csv' : 'image',
      });
      setIsGridImage(false);
      if (csvFile) setAdminImportMode(PHOTO_IMPORT_MODE);
      setStep('configure');
      setAiEnhancingSize(null);
      aiEnhancingRef.current.clear();
      setEditorStatus('');
      setError('');
    } catch (err) {
      setError(csvFile ? 'Unable to read CSV' : 'Unable to read image');
    } finally {
      resetFileInput();
    }
  };

  const handleDrop = (e) => {
    e.preventDefault();
    setDragging(false);
    const file = e.dataTransfer.files[0];
    if (file) handleFileSelect(file);
  };

  const handleProcess = async () => {
    if (!uploaded?.file) return;
    const importingCsv = uploaded.kind === 'csv';
    setProcessing(true);
    setError('');
    setEditorStatus('');
    const form = new FormData();
    form.append('file', uploaded.file);
    form.append('grid_size', settings.gridSize);
    form.append('palette_name', 'MARD');
    form.append('quality', settings.quality);
    form.append('is_grid_image', String(adminImportMode === READY_GRID_IMPORT_MODE ? false : isGridImage));
    form.append('import_mode', adminImportMode);
    try {
      const res = await apiFetch('/admin/upload', { method: 'POST', body: form });
      if (!res?.ok) {
        const err = await res?.json();
        setError(err?.detail || 'Processing failed');
        return;
      }
      const data = await res.json();
      setProcessingResult(data);
      setAiEnhancingSize(null);
      aiEnhancingRef.current.clear();
      if (data.variants) {
        const keys = Object.keys(data.variants);
        setSelectedSize(keys.includes('24x24') ? '24x24' : keys[Math.floor(keys.length / 2)]);
      } else {
        setSelectedSize(null);
      }
      if ((importingCsv || adminImportMode === READY_GRID_IMPORT_MODE) && !publishTitle.trim()) {
        setPublishTitle(uploaded.name.replace(/\.(csv|png|jpe?g|webp)$/i, ''));
      }
      setStep('preview');
    } catch (err) {
      setError('Connection error during processing');
    } finally {
      setProcessing(false);
    }
  };

  const isMultiSize = processingResult?.variants != null;
  const activeResult = isMultiSize ? processingResult?.variants?.[selectedSize] : processingResult;
  const activeAiMeta = activeResult?.ai_enhancement;
  const activeAiGrid = activeResult?.ai_grid;
  const isActiveAiEnhancing = aiEnhancingSize && aiEnhancingSize === selectedSize;
  const aiStatusText = activeAiMeta?.error_type === 'safety_blocked'
    ? 'OpenAI rejected this image edit request'
    : activeAiGrid?.used
      ? 'OpenAI JSON grid preview'
    : activeAiMeta?.used
      ? 'AI enhanced preview'
      : `AI enhancement failed: ${activeAiMeta?.reason || 'unavailable'}`;

  const applyEditedGridResult = useCallback((result) => {
    if (!result?.rows || !result?.cols || !Array.isArray(result.cells)) {
      setError('Editor returned an invalid grid result');
      return false;
    }

    setProcessingResult(prev => {
      if (prev?.variants && selectedSize) {
        return {
          ...prev,
          variants: {
            ...prev.variants,
            [selectedSize]: result,
          },
        };
      }
      return result;
    });
    setError('');
    setEditorStatus('Edited grid received. Preview updated.');
    return true;
  }, [selectedSize]);

  const consumeEditorResult = useCallback((payload) => {
    const updatedAt = Number(payload?.updated_at || Date.now());
    if (updatedAt <= editorResultTimestampRef.current) return false;
    if (!applyEditedGridResult(payload?.result)) return false;
    editorResultTimestampRef.current = updatedAt;
    localStorage.removeItem('pixelcraft_editor_result');
    return true;
  }, [applyEditedGridResult]);

  const restorePixelCraftDraft = useCallback(() => {
    const rawDraft = localStorage.getItem('pixelcraft_admin_draft');
    if (!rawDraft) return false;

    try {
      const draft = JSON.parse(rawDraft);
      const rawResult = localStorage.getItem('pixelcraft_editor_result');
      const editorPayload = rawResult ? JSON.parse(rawResult) : null;
      const editedResult = editorPayload?.result;
      const restoredSelectedSize = draft.selectedSize || null;
      let restoredProcessingResult = draft.processingResult;

      if (editedResult?.rows && editedResult?.cols && Array.isArray(editedResult.cells)) {
        if (restoredProcessingResult?.variants && restoredSelectedSize) {
          restoredProcessingResult = {
            ...restoredProcessingResult,
            variants: {
              ...restoredProcessingResult.variants,
              [restoredSelectedSize]: editedResult,
            },
          };
        } else {
          restoredProcessingResult = editedResult;
        }
        editorResultTimestampRef.current = Number(editorPayload.updated_at || Date.now());
        localStorage.removeItem('pixelcraft_editor_result');
        setEditorStatus('Edited grid received. Preview updated.');
      } else {
        setEditorStatus('Draft restored. You can keep editing or publish.');
      }

      if (!restoredProcessingResult) return false;
      setUploaded(draft.uploaded ? { ...draft.uploaded, sourceImageDataUrl: draft.sourceImageDataUrl || null } : null);
      setSettings(draft.settings || { gridSize: '24x24', quality: 85 });
      setProcessingResult(restoredProcessingResult);
      setSelectedSize(restoredSelectedSize);
      setPublishTitle(draft.publishTitle || '');
      setPublishTags(draft.publishTags || '');
      setPublishSize(draft.publishSize || 'Medium');
      setIsGridImage(Boolean(draft.isGridImage));
      setAdminImportMode(draft.adminImportMode || PHOTO_IMPORT_MODE);
      setStep('preview');
      setAiEnhancingSize(null);
      aiEnhancingRef.current.clear();
      setError('');
      return true;
    } catch (err) {
      console.error('Unable to restore PixelCraft draft:', err);
      setError('Unable to restore the edited grid draft');
      localStorage.removeItem('pixelcraft_admin_draft');
      localStorage.removeItem('pixelcraft_editor_result');
      return false;
    }
  }, []);

  useEffect(() => {
    const handleFocus = () => {
      const raw = localStorage.getItem('pixelcraft_editor_result');
      if (!raw) return;
      try {
        consumeEditorResult(JSON.parse(raw));
      } catch (err) {
        console.error('Unable to read editor result:', err);
        setError('Unable to read the edited grid result');
      }
    };

    window.addEventListener('focus', handleFocus);
    return () => {
      window.removeEventListener('focus', handleFocus);
    };
  }, [consumeEditorResult]);

  useEffect(() => {
    apiFetch('/admin/stats').then(r => r?.json()).then(d => { if (d) setStats(d); });
    restorePixelCraftDraft();
  }, [restorePixelCraftDraft]);

  const handleEditGrid = () => {
    if (!activeResult) return;
    const payload = {
      source: 'pixelcraft-admin',
      updated_at: Date.now(),
      selected_size: selectedSize,
      image: { source_name: uploaded?.name || activeResult.image?.source_name || 'pattern' },
      source_image_data_url: uploaded?.sourceImageDataUrl || null,
      result: activeResult,
    };
    localStorage.setItem('pixelcraft_admin_draft', JSON.stringify({
      uploaded: uploaded ? { name: uploaded.name, size: uploaded.size } : null,
      sourceImageDataUrl: uploaded?.sourceImageDataUrl || null,
      settings,
      processingResult,
      selectedSize,
      publishTitle,
      publishTags,
      publishSize,
      isGridImage,
      adminImportMode,
    }));
    localStorage.setItem('pixelcraft_editor_payload', JSON.stringify(payload));
    localStorage.removeItem('pixelcraft_editor_result');
    localStorage.setItem('pc_page', 'admin');
    setEditorStatus('Opening editor...');
    window.location.href = '/bead-editor?pixelcraft=1&return=%2F';
  };

  const markAiEnhancementForSize = (size, meta) => {
    setProcessingResult(prev => {
      if (!prev?.variants?.[size]) return prev;
      return {
        ...prev,
        variants: {
          ...prev.variants,
          [size]: {
            ...prev.variants[size],
            ai_enhancement: meta,
            ai_grid: meta.ai_grid,
          },
        },
      };
    });
  };

  const handleAiEnhancePreview = async () => {
    if (!activeResult || !selectedSize || isGridImage || isActiveAiEnhancing) return;
    const sourceFile = uploaded?.file || (uploaded?.sourceImageDataUrl ? dataUrlToFile(uploaded.sourceImageDataUrl, uploaded.name || 'source.png') : null);
    if (!sourceFile) {
      setError('Original image is unavailable. Upload the image again to use AI enhance.');
      return;
    }

    setError('');
    setEditorStatus('');
    setAiEnhancingSize(selectedSize);
    const form = new FormData();
    form.append('file', sourceFile);
    form.append('grid_size', selectedSize);
    form.append('palette_name', 'MARD');
    form.append('quality', settings.quality);
    form.append('current_grid_json', JSON.stringify(activeResult));

    try {
      const res = await apiFetch('/admin/enhance-preview', { method: 'POST', body: form });
      if (!res?.ok) {
        const err = await res?.json();
        const detail = err?.detail;
        const detailMeta = typeof detail === 'object' && detail !== null ? detail : {};
        const enhancementMeta = detailMeta.ai_enhancement || detailMeta;
        const gridMeta = detailMeta.ai_grid;
        markAiEnhancementForSize(selectedSize, {
          attempted: true,
          used: false,
          provider: 'openai',
          ...enhancementMeta,
          reason: enhancementMeta.reason || (typeof detail === 'string' ? detail : 'AI enhancement failed'),
          ai_grid: gridMeta,
        });
        setError(enhancementMeta.reason || (typeof detail === 'string' ? detail : 'AI enhancement failed'));
        return;
      }
      const enhanced = await res.json();
      setProcessingResult(prev => {
        if (!prev?.variants?.[selectedSize]) return prev;
        return {
          ...prev,
          variants: {
            ...prev.variants,
            [selectedSize]: enhanced,
          },
        };
      });
      setEditorStatus('AI enhanced preview applied.');
    } catch (err) {
      markAiEnhancementForSize(selectedSize, {
        attempted: true,
        used: false,
        provider: 'openai',
        reason: 'Connection error during AI enhancement',
      });
      setError('Connection error during AI enhancement');
    } finally {
      setAiEnhancingSize(current => current === selectedSize ? null : current);
    }
  };

  useEffect(() => {
    if (!AI_ENHANCEMENT_ENABLED) return;
    if (step !== 'preview' || isGridImage || !uploaded?.file || !processingResult?.variants || !selectedSize) return;
    const current = processingResult.variants[selectedSize];
    if (!current || current.ai_enhancement?.attempted || aiEnhancingRef.current.has(selectedSize)) return;

    const requestedSize = selectedSize;
    const runAiEnhancement = async () => {
      aiEnhancingRef.current.add(requestedSize);
      setAiEnhancingSize(requestedSize);
      const form = new FormData();
      form.append('file', uploaded.file);
      form.append('grid_size', requestedSize);
      form.append('palette_name', 'MARD');
      form.append('quality', settings.quality);
      try {
        const res = await apiFetch('/admin/enhance-preview', { method: 'POST', body: form });
        if (!res?.ok) {
          const err = await res?.json();
          const detail = err?.detail;
          const detailMeta = typeof detail === 'object' && detail !== null ? detail : {};
          const enhancementMeta = detailMeta.ai_enhancement || detailMeta;
          const gridMeta = detailMeta.ai_grid;
          markAiEnhancementForSize(requestedSize, {
            attempted: true,
            used: false,
            provider: 'openai',
            ...enhancementMeta,
            reason: enhancementMeta.reason || (typeof detail === 'string' ? detail : 'AI enhancement failed'),
            ai_grid: gridMeta,
          });
          return;
        }
        const enhanced = await res.json();
        setProcessingResult(prev => {
          if (!prev?.variants?.[requestedSize]) return prev;
          return {
            ...prev,
            variants: {
              ...prev.variants,
              [requestedSize]: enhanced,
            },
          };
        });
      } catch (err) {
        markAiEnhancementForSize(requestedSize, {
          attempted: true,
          used: false,
          provider: 'openai',
          reason: 'Connection error during AI enhancement',
        });
      } finally {
        aiEnhancingRef.current.delete(requestedSize);
        setAiEnhancingSize(current => current === requestedSize ? null : current);
      }
    };
    runAiEnhancement();
  }, [step, isGridImage, uploaded?.file, processingResult, selectedSize, settings.quality]);

  const handlePublish = async () => {
    if (!activeResult || !publishTitle.trim()) return;
    setPublishing(true);
    setError('');
    const tags = publishTags.split(',').map(t => t.trim()).filter(Boolean);
    try {
      const res = await apiFetch('/admin/publish', {
        method: 'POST',
        body: JSON.stringify({ title: publishTitle.trim(), tags, size: publishSize, processing_result: activeResult }),
      });
      if (!res?.ok) {
        const err = await res?.json();
        setError(err?.detail || 'Publish failed');
        return;
      }
      onPatternPublished && onPatternPublished();
      setStep('upload');
      setUploaded(null);
      setProcessingResult(null);
      setAiEnhancingSize(null);
      setEditorStatus('');
      setPublishTitle('');
      setPublishTags('');
      setAdminImportMode(PHOTO_IMPORT_MODE);
      localStorage.removeItem('pixelcraft_admin_draft');
      localStorage.removeItem('pixelcraft_editor_payload');
      apiFetch('/admin/stats').then(r => r?.json()).then(d => { if (d) setStats(d); });
    } catch (err) {
      setError('Connection error during publish');
    } finally {
      setPublishing(false);
    }
  };

  const inputStyle = {
    width:'100%',border:'2px solid #e8e6e1',borderRadius:8,padding:'10px 14px',
    fontSize:14,fontFamily:'inherit',outline:'none',background:'#fafaf8',
    transition:'border-color 0.15s'
  };

  return (
    <div className="pixel-bg" style={{minHeight:'calc(100vh - 60px)',padding:'40px 40px'}}>
      <div style={{marginBottom:32}}>
        <h1 style={{fontSize:36,fontWeight:800,letterSpacing:'-0.03em',marginBottom:8}}>Admin <span style={{color:T.accentRed}}>Dashboard</span></h1>
        <p style={{color:'#888',fontSize:15}}>Upload images and configure bead pattern conversion</p>
      </div>

      <div style={{display:'inline-flex',background:'#fff',border:'1px solid #f0ede8',borderRadius:12,padding:4,marginBottom:24,boxShadow:'0 8px 24px rgba(26,26,24,0.04)'}}>
        {[
          [PHOTO_IMPORT_MODE, 'Photo / CSV'],
          [READY_GRID_IMPORT_MODE, 'Ready Grid Image'],
        ].map(([mode,label]) => {
          const active = adminImportMode === mode;
          return (
            <button key={mode} onClick={() => {
              setAdminImportMode(mode);
              setIsGridImage(false);
              setError('');
            }} style={{
              background:active?`linear-gradient(135deg, ${T.accentRed}, ${T.accentOrange})`:'transparent',
              color:active?'#fff':'#666',
              border:'none',borderRadius:8,padding:'10px 16px',fontWeight:800,fontSize:13,
              cursor:'pointer',fontFamily:'inherit',transition:'all 0.2s'
            }}>{label}</button>
          );
        })}
      </div>

      {/* Steps indicator */}
      <div style={{display:'flex',gap:0,marginBottom:32,maxWidth:480}}>
        {[['upload','01 Upload'],['configure','02 Configure'],['preview','03 Preview']].map(([id,label],i,arr) => {
          const steps = ['upload','configure','preview'];
          const active = step === id;
          const done = steps.indexOf(step) > i;
          return (
            <React.Fragment key={id}>
              <div style={{flex:1,padding:'8px 0',textAlign:'center',
                background: active ? T.accentRed : done ? `${T.accentRed}20` : '#f2f1ee',
                color: active ? '#fff' : done ? T.accentRed : '#aaa',
                fontSize:12,fontWeight:700,letterSpacing:'.05em',
                borderRadius: i===0?'8px 0 0 8px':i===arr.length-1?'0 8px 8px 0':0,
                transition:'all 0.2s'
              }}>{label}</div>
              {i < arr.length-1 && <div style={{width:1,background:'#e8e6e1'}}/>}
            </React.Fragment>
          );
        })}
      </div>

      {error && (
        <div style={{background:'#FEE2E2',border:'1px solid #FCA5A5',borderRadius:10,padding:'10px 16px',marginBottom:20,fontSize:13,color:'#991B1B',maxWidth:640}}>
          ⚠ {error}
        </div>
      )}

      <div className="admin-layout" style={{display:'grid',gridTemplateColumns:'1fr 380px',gap:24,maxWidth:960}}>
        <div>
          {/* Step 1: Upload */}
          {step === 'upload' && (
            <div>
              <input
                ref={fileInputRef}
                type="file"
                accept="image/png,image/jpeg,image/webp,.csv,text/csv"
                style={{display:'none'}}
                onChange={e => {
                  handleFileSelect(e.target.files?.[0]);
                  e.target.value = '';
                }}
              />
              <div
                role="button"
                tabIndex={0}
                aria-label="Choose image or CSV file"
                onDragOver={e=>{e.preventDefault();setDragging(true)}}
                onDragLeave={()=>setDragging(false)}
                onDrop={handleDrop}
                onClick={() => { resetFileInput(); fileInputRef.current?.click(); }}
                onKeyDown={event => {
                  if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    resetFileInput();
                    fileInputRef.current?.click();
                  }
                }}
                style={{border:`2px dashed ${dragging?T.accentRed:'#d0cec9'}`,borderRadius:16,padding:'60px 40px',textAlign:'center',background:dragging?`${T.accentRed}08`:'#fff',transition:'all 0.2s',cursor:'pointer'}}>
                <div style={{width:72,height:72,borderRadius:16,background:`${T.accentRed}12`,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 20px'}}>
                  <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke={T.accentRed} strokeWidth="1.5">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
                  </svg>
                </div>
                <div style={{fontWeight:700,fontSize:18,marginBottom:8}}>
                  {adminImportMode === READY_GRID_IMPORT_MODE ? 'Drop ready grid image here' : 'Drop image here'}
                </div>
                <div style={{color:'#999',fontSize:13,marginBottom:20}}>
                  {adminImportMode === READY_GRID_IMPORT_MODE
                    ? 'or click to browse · numbered grid JPG, PNG, WEBP up to 20 MB'
                    : 'or click to browse · JPG, PNG, WEBP up to 20 MB · CSV up to 5 MB'}
                </div>
                <span style={{background:T.accentRed,color:'#fff',border:'none',borderRadius:8,padding:'10px 28px',fontWeight:700,fontSize:13,cursor:'pointer'}}>Choose File</span>
              </div>
            </div>
          )}

          {/* Step 2: Configure */}
          {step === 'configure' && uploaded && (
            <div style={{background:'#fff',borderRadius:16,padding:28,border:'1px solid #f0ede8'}}>
              <div style={{display:'flex',alignItems:'center',gap:14,padding:'12px 16px',background:'#f8f7f4',borderRadius:10,marginBottom:24}}>
                <div style={{width:40,height:40,borderRadius:8,background:`${T.accentRed}15`,display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <svg width="18" height="18" viewBox="0 0 24 24" fill={T.accentRed} opacity=".7"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
                </div>
                <div style={{flex:1}}>
                  <div style={{fontWeight:700,fontSize:14}}>{uploaded.name}</div>
                  <div style={{fontSize:12,color:'#999'}}>{uploaded.size}</div>
                </div>
                <button onClick={()=>{setUploaded(null);setAiEnhancingSize(null);resetFileInput();setStep('upload');}} aria-label="Remove selected upload" style={{background:'none',border:'none',color:'#777',cursor:'pointer',fontSize:18}}>×</button>
              </div>

              {uploaded.kind === 'csv' ? (
                <div style={{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',
                  background:`${T.accentRed}08`,border:`2px solid ${T.accentRed}`,
                  borderRadius:10,marginBottom:20}}>
                  <div style={{width:20,height:20,borderRadius:5,background:T.accentRed,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13,color:T.accentRed}}>Import CSV Pattern</div>
                    <div style={{fontSize:12,color:'#999',marginTop:2}}>Reads bead-pattern CSV grids like bead-pattern-100x112-MARD_20260502-091813.csv</div>
                  </div>
                </div>
              ) : adminImportMode === READY_GRID_IMPORT_MODE ? (
                <div style={{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',
                  background:`${T.accentRed}08`,border:`2px solid ${T.accentRed}`,
                  borderRadius:10,marginBottom:20}}>
                  <div style={{width:20,height:20,borderRadius:5,background:T.accentRed,display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}}>
                    <svg width="11" height="11" viewBox="0 0 12 12" fill="none"><polyline points="2,6 5,9 10,3" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>
                  </div>
                  <div style={{flex:1}}>
                    <div style={{fontWeight:700,fontSize:13,color:T.accentRed}}>Ready Grid Image</div>
                    <div style={{fontSize:12,color:'#999',marginTop:2}}>Reads color codes printed inside cells. Numbered row/column headers are ignored.</div>
                  </div>
                </div>
              ) : (
                <div
                  role="checkbox"
                  tabIndex={0}
                  aria-checked={isGridImage ? 'true' : 'false'}
                  onClick={()=>setIsGridImage(v=>!v)}
                  onKeyDown={event => {
                    if (event.key === 'Enter' || event.key === ' ') {
                      event.preventDefault();
                      setIsGridImage(value => !value);
                    }
                  }}
                  style={{display:'flex',alignItems:'center',gap:14,padding:'14px 16px',
                    background:isGridImage?`${T.accentRed}08`:'#f8f7f4',
                    border:`2px solid ${isGridImage?T.accentRed:'#e8e6e1'}`,

function AddMemberPage({ onCreated, onCancel }) {
  const [name, setName] = useState('');
  const [phone, setPhone] = useState('');
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [restoreCandidate, setRestoreCandidate] = useState(null);
  const inputStyle = {
    width:'100%',border:'1px solid #E8E6E1',borderRadius:8,padding:'10px 12px',
    fontSize:13,fontFamily:'inherit',outline:'none',background:'#fff'
  };

  const submit = async event => {
    event.preventDefault();
    if (restoreCandidate) return;
    if (!name.trim() || !phone.trim()) {
      setError('Name and phone are required.');
      return;
    }
    setLoading(true);
    setError('');
    try {
      const res = await apiFetch('/members', {
        method:'POST',
        body:JSON.stringify({ name: name.trim(), phone: phone.trim() }),
      });
      if (!res?.ok) {
        try {
          const detail = (await res?.json())?.detail;
          if (detail?.code === 'deactivated_member_exists' && detail.member?.id) {
            setRestoreCandidate(detail.member);
          } else {
            setError(typeof detail === 'string' ? detail : 'Unable to create member.');
          }
        } catch (_) {
          setError('Unable to create member.');
        }
        return;
      }
      onCreated(await res.json());
    } catch (_) {
      setError('Unable to create member.');
    } finally {
      setLoading(false);
    }
  };

  const resolveDeactivatedMember = async action => {
    if (!restoreCandidate) return;
    setLoading(true);
    setError('');
    try {
      const isRestore = action === 'restore';
      const res = await apiFetch(
        `/members/${restoreCandidate.id}/${isRestore ? 'restore' : 'archive-and-replace'}`,
        {
          method:'POST',
          ...(isRestore ? {} : { body:JSON.stringify({ name:name.trim(), phone:phone.trim() }) }),
        },
      );
      if (!res?.ok) {
        try {
          const detail = (await res?.json())?.detail;
          setError(typeof detail === 'string' ? detail : 'Unable to update the member account.');
        } catch (_) {
          setError('Unable to update the member account.');
        }
        return;
      }
      onCreated(await res.json());
    } catch (_) {
      setError('Unable to update the member account.');
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="page-shell pixel-bg">
      <div className="page-inner" style={{maxWidth:700}}>
        <div className="page-header" style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:18,flexWrap:'wrap'}}>
          <div>
            <h1 style={{fontSize:36,fontWeight:800,letterSpacing:'0',marginBottom:8}}>Add Member</h1>
            <p style={{color:'#888',fontSize:15}}>Create a member record with the details needed for check-ins and balance access.</p>
          </div>
          <button type="button" onClick={onCancel} style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:'10px 14px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Back to dashboard</button>
        </div>
        <form onSubmit={submit} style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:22,display:'grid',gap:14}}>
          <div>
            <label htmlFor="new-member-name" style={{display:'block',fontSize:12,fontWeight:800,color:'#555',marginBottom:6}}>Name</label>
            <input id="new-member-name" value={name} onChange={event=>setName(event.target.value)} autoComplete="name" disabled={loading || !!restoreCandidate} style={inputStyle}/>
          </div>
          <div>
            <label htmlFor="new-member-phone" style={{display:'block',fontSize:12,fontWeight:800,color:'#555',marginBottom:6}}>Phone</label>
            <input id="new-member-phone" value={phone} onChange={event=>setPhone(event.target.value)} placeholder="+61 412 345 678" type="tel" autoComplete="tel" disabled={loading || !!restoreCandidate} style={inputStyle}/>
          </div>
          {restoreCandidate && <div role="status" style={{background:'#FFF7ED',border:'1px solid #FDBA74',borderRadius:8,padding:'14px',display:'grid',gap:10}}>
            <div style={{fontSize:14,fontWeight:800,color:'#9A3412'}}>A deactivated account already uses this phone number.</div>
            <div style={{fontSize:13,color:'#7C2D12',lineHeight:1.5}}>Restore Old Account keeps its member history and remaining balance. Create New Account permanently archives the old account and creates a fresh account with this name and phone.</div>
            <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
              <button type="button" disabled={loading} onClick={()=>resolveDeactivatedMember('restore')} style={{background:loading?'#E8E6E1':T.accentRed,color:loading?'#888':'#fff',border:'none',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:loading?'default':'pointer'}}>Restore Old Account</button>
              <button type="button" disabled={loading} onClick={()=>resolveDeactivatedMember('replace')} style={{background:'#fff',color:'#9A3412',border:'1px solid #FDBA74',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:loading?'default':'pointer'}}>Create New Account</button>
              <button type="button" disabled={loading} onClick={()=>{setRestoreCandidate(null);setError('');}} style={{background:'transparent',color:'#666',border:'1px solid #ddd',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:loading?'default':'pointer'}}>Cancel</button>
            </div>
          </div>}
          {error && <div role="status" style={{background:'#FEE2E2',border:'1px solid #FCA5A5',borderRadius:8,padding:'10px 12px',fontSize:13,color:'#991B1B'}}>{error}</div>}
          {!restoreCandidate && <button type="submit" disabled={loading} style={{background:loading?'#E8E6E1':T.accentRed,color:loading?'#888':'#fff',border:'none',borderRadius:8,padding:'11px 14px',fontWeight:800,fontFamily:'inherit',cursor:loading?'default':'pointer'}}>{loading ? 'Creating…' : 'Create Member'}</button>}
        </form>
      </div>
    </div>
  );
}
