function MembershipPage({ user, onLogout }) {
  const isAdmin = !!user?.is_admin;
  const [query, setQuery] = useState('');
  const [members, setMembers] = useState([]);
  const [selected, setSelected] = useState(null);
  const [tables, setTables] = useState([]);
  const [message, setMessage] = useState('');
  const [loading, setLoading] = useState(false);
  const [scanMessage, setScanMessage] = useState('Camera scan is optional. Manual Member ID search always works.');
  const [scanning, setScanning] = useState(false);
  const [selectedQrUrl, setSelectedQrUrl] = useState('');
  const [packageForm, setPackageForm] = useState({ package_name:'10-hour package', hours:'10' });
  const [editForm, setEditForm] = useState({ name:'', phone:'', password:'', is_active:true, notes:'' });
  const [visitForm, setVisitForm] = useState({ table_number:'1', checked_in_at:'', checked_out_at:'', notes:'' });
  const [editingVisit, setEditingVisit] = useState(null);
  const [visitEditorOpen, setVisitEditorOpen] = useState(false);
  const [promotionPhone, setPromotionPhone] = useState('');
  const [checkInTable, setCheckInTable] = useState('1');
  const [manualMemberCode, setManualMemberCode] = useState('');
  const [staffView, setStaffView] = useState('dashboard');
  const videoRef = useRef(null);
  const scanCanvasRef = useRef(null);
  const balanceQrUrlRef = useRef('');

  const inputStyle = {
    width:'100%',border:'1px solid #E8E6E1',borderRadius:8,padding:'10px 12px',
    fontSize:13,fontFamily:'inherit',outline:'none',background:'#fff'
  };

  const loadTables = useCallback(async () => {
    const res = await apiFetch('/timetable');
    const data = res?.ok ? await res.json() : null;
    if (Array.isArray(data)) setTables(data);
  }, []);

  const selectMember = useCallback(async (member) => {
    const res = await apiFetch(`/members/${member.id}`);
    if (res?.ok) {
      setSelected(await res.json());
    } else {
      setSelected(member);
    }
  }, []);

  const replaceBalanceQrUrl = useCallback(nextUrl => {
    if (balanceQrUrlRef.current && balanceQrUrlRef.current !== nextUrl) {
      URL.revokeObjectURL(balanceQrUrlRef.current);
    }
    balanceQrUrlRef.current = nextUrl;
  }, []);

  useEffect(() => () => replaceBalanceQrUrl(''), [replaceBalanceQrUrl]);

  const search = useCallback(async (term = '') => {
    if (!isAdmin) return;
    setLoading(true);
    setMessage('');
    try {
      const res = await apiFetch('/members/search?q=' + encodeURIComponent(term));
      const data = res?.ok ? await res.json() : null;
      if (Array.isArray(data)) {
        setMembers(data);
        if (data.length === 1) await selectMember(data[0]);
      }
    } finally {
      setLoading(false);
    }
  }, [isAdmin, selectMember]);

  useEffect(() => {
    if (isAdmin) {
      search('');
      loadTables();
    }
  }, [isAdmin, search, loadTables]);

  useEffect(() => {
    if (!selected?.id || !selected?.member_code) {
      setSelectedQrUrl('');
      return;
    }
    let cancelled = false;
    apiFetch(`/members/${selected.id}/qr`).then(async res => {
      if (!res?.ok || cancelled) return;
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      setSelectedQrUrl(prev => {
        if (prev) URL.revokeObjectURL(prev);
        return url;
      });
    });
    return () => { cancelled = true; };
  }, [selected?.id]);

  useEffect(() => {
    if (!selected) return;
    setEditForm({
      name:selected.name || '',
      phone:selected.phone || '',
      password:'',
      is_active:selected.is_active !== false,
      notes:selected.notes || '',
    });
    setPromotionPhone(selected.phone || '');
  }, [selected?.id, selected?.name, selected?.phone, selected?.is_active, selected?.notes]);

  const saveMember = async () => {
    if (!selected) return;
    if (!editForm.name.trim() || !editForm.phone.trim()) {
      setMessage('Name and phone are required.');
      return;
    }
    const res = await apiFetch(`/members/${selected.id}`, {
      method:'PUT',
      body:JSON.stringify({
        name:editForm.name,
        phone:editForm.phone,
        password:editForm.password,
        is_active:editForm.is_active,
        notes:editForm.notes,
      }),
    });
    if (!res?.ok) {
      let detail = 'Unable to update member.';
      try { detail = (await res.json())?.detail || detail; } catch (_) {}
      setMessage(detail);
      return;
    }
    const updated = await res.json();
    setMembers(prev => prev.map(member => member.id === updated.id ? {...member,...updated} : member));
    await selectMember(updated);
    setMessage('Member profile updated.');
  };

  const promoteMembership = async () => {
    if (!selected || !promotionPhone.trim()) {
      setMessage('A valid unique phone is required to promote this account.');
      return;
    }
    const res = await apiFetch(`/members/${selected.id}/membership`, {
      method:'POST',
      body:JSON.stringify({ phone:promotionPhone }),
    });
    if (!res?.ok) {
      let detail = 'Unable to promote this account.';
      try { detail = (await res.json())?.detail || detail; } catch (_) {}
      setMessage(detail);
      return;
    }
    const promoted = await res.json();
    setMembers(prev => prev.map(account => account.id === promoted.id ? {...account,...promoted} : account));
    await selectMember(promoted);
    setMessage('Membership capability added. Administrator access is unchanged.');
  };

  const removeMembership = async () => {
    if (!selected?.member_code || !window.confirm('Remove membership capability from this account?')) return;
    const res = await apiFetch(`/members/${selected.id}/membership`, { method:'DELETE' });
    if (!res?.ok) {
      let detail = 'Unable to remove membership capability.';
      try { detail = (await res.json())?.detail || detail; } catch (_) {}
      setMessage(detail);
      return;
    }
    const updated = await res.json();
    setMembers(prev => prev.map(account => account.id === updated.id ? {...account,...updated} : account));
    setSelected(prev => ({...prev,...updated,packages:[],visits:[]}));
    setMessage('Membership capability removed. The account and administrator access remain active.');
  };

  const deleteMember = async () => {
    if (!selected?.member_code || selected.is_admin) return;
    if (!window.confirm(`Deactivate ${selected.name}? They will no longer appear in member search or QR check-in.`)) return;
    const res = await apiFetch(`/members/${selected.id}`, { method:'DELETE' });
    if (!res?.ok) {
      let detail = 'Unable to delete member.';
      try { detail = (await res.json())?.detail || detail; } catch (_) {}
      setMessage(detail);
      return;
    }
    setMembers(prev => prev.filter(member => member.id !== selected.id));
    setSelected(null);
    setMessage('Member deactivated.');
  };

  const createMember = created => {
    setMembers(prev => [created, ...prev.filter(member => member.id !== created.id)]);
    setSelected(created);
    setStaffView('dashboard');
    setMessage('Member created. Their balance link is ready to share.');
  };

  const copyBalanceLink = async () => {
    const balanceLink = selected?.balance_access_token
      ? window.location.origin + '/member/' + selected.balance_access_token
      : '';
    if (!balanceLink) {
      setMessage('Regenerate the balance link before copying it.');
      return;
    }
    try {
      await navigator.clipboard.writeText(balanceLink);
      setMessage('Balance link copied.');
    } catch (_) {
      setMessage('Unable to copy the balance link.');
    }
  };

  const downloadBalanceQr = async () => {
    if (!selected?.id || !selected?.balance_access_token) {
      setMessage('Regenerate the balance link before downloading its QR code.');
      return;
    }
    const res = await apiFetch(`/members/${selected.id}/balance-qr?origin=${encodeURIComponent(window.location.origin)}`);
    if (!res?.ok) {
      setMessage('Unable to create the balance QR code.');
      return;
    }
    const nextUrl = URL.createObjectURL(await res.blob());
    replaceBalanceQrUrl(nextUrl);
    const download = document.createElement('a');
    download.href = nextUrl;
    download.download = `${selected.member_code || 'member'}-balance-qr.png`;
    document.body.appendChild(download);
    download.click();
    download.remove();
    setMessage('Balance QR download started.');
  };

  const regenerateBalanceLink = async () => {
    if (!selected?.id || !window.confirm('Regenerate this private balance link? The previous link will stop working.')) return;
    const res = await apiFetch(`/members/${selected.id}/balance-link/regenerate`, { method:'POST' });
    if (!res?.ok) {
      setMessage('Unable to regenerate the balance link.');
      return;
    }
    const link = await res.json();
    const updated = { ...selected, ...link };
    replaceBalanceQrUrl('');
    setSelected(updated);
    setMembers(prev => prev.map(member => member.id === updated.id ? { ...member, ...updated } : member));
    setMessage('Balance link regenerated. The previous link no longer works.');
  };

  const addPackage = async () => {
    if (!selected) return;
    const hours = Number(packageForm.hours);
    if (!Number.isFinite(hours) || hours <= 0) {
      setMessage('Package hours must be greater than zero.');
      return;
    }
    const res = await apiFetch(`/members/${selected.id}/packages`, {
      method:'POST',
      body: JSON.stringify({
        package_name: packageForm.package_name || 'Membership package',
        total_seconds: Math.round(hours * 3600),
      }),
    });
    if (!res?.ok) {
      setMessage('Unable to add package.');
      return;
    }
    await selectMember(selected);
    setMessage('Package added.');
  };

  const toDateTimeLocalValue = value => {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    const local = new Date(date.getTime() - (date.getTimezoneOffset() * 60000));
    return local.toISOString().slice(0, 16);
  };

  const openVisitEditor = visit => {
    if (visit) {
      setEditingVisit(visit);
      setVisitForm({
        table_number:String(visit.table_number || 1),
        checked_in_at:toDateTimeLocalValue(visit.checked_in_at),
        checked_out_at:toDateTimeLocalValue(visit.checked_out_at),
        notes:visit.notes || '',
      });
    } else {
      const checkedIn = new Date();
      const checkedOut = new Date(checkedIn.getTime() + (60 * 60 * 1000));
      setEditingVisit(null);
      setVisitForm({
        table_number:checkInTable || '1',
        checked_in_at:toDateTimeLocalValue(checkedIn),
        checked_out_at:toDateTimeLocalValue(checkedOut),
        notes:'',
      });
    }
    setVisitEditorOpen(true);
  };

  const saveVisit = async () => {
    if (!selected || !visitForm.checked_in_at || !visitForm.checked_out_at) {
      setMessage('Check-in and check-out times are required.');
      return;
    }
    const path = editingVisit
      ? `/members/${selected.id}/visits/${editingVisit.id}`
      : `/members/${selected.id}/visits`;
    const res = await apiFetch(path, {
      method:editingVisit ? 'PUT' : 'POST',
      body:JSON.stringify({
        table_number:Number(visitForm.table_number),
        checked_in_at:visitForm.checked_in_at,
        checked_out_at:visitForm.checked_out_at,
        notes:visitForm.notes,
      }),
    });
    if (!res?.ok) {
      let detail = 'Unable to save check-in record.';
      try { detail = (await res.json())?.detail || detail; } catch (_) {}
      setMessage(detail);
      return;
    }
    await selectMember(selected);
    setVisitEditorOpen(false);
    setEditingVisit(null);
    setMessage(editingVisit ? 'Check-in record updated.' : 'Check-in record added.');
  };

  const checkInMember = async () => {
    const memberCode = (selected?.member_code || manualMemberCode).trim();
    if (!memberCode) {
      setMessage('Select a member or enter a Manual Member ID.');
      return;
    }
    const tableNumber = Number(checkInTable);
    const table = tables.find(row => row.table_number === tableNumber);
    const path = table?.is_running ? `/timetable/${tableNumber}/member` : `/timetable/${tableNumber}/start`;
    const res = await apiFetch(path, {
      method:'POST',
      body: JSON.stringify({ member_code: memberCode }),
    });
    if (!res?.ok) {
      setMessage('Unable to check in this member.');
      return;
    }
    await loadTables();
    setMessage(`Member checked in to Table ${tableNumber}.`);
  };

  const startCameraScan = async () => {
    if (scanning) return;
    setScanMessage('');
    if (!navigator.mediaDevices?.getUserMedia) {
      setScanMessage('Camera access is not available in this browser. Use Manual Member ID.');
      return;
    }
    let stream = null;
    const stopScanning = () => {
      stream?.getTracks().forEach(track => track.stop());
      setScanning(false);
    };
    const handleScannedValue = async (value) => {
      const memberCode = String(value || '').trim();
      if (!memberCode) return false;
      setManualMemberCode(memberCode);
      setQuery(memberCode);
      setScanMessage(`Scanned ${memberCode}`);
      stopScanning();
      await search(memberCode);
      return true;
    };
    try {
      setScanning(true);
      setScanMessage('Point the camera at a member QR code.');
      stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:{ ideal:'environment' } } });
      if (videoRef.current) videoRef.current.srcObject = stream;
      if ('BarcodeDetector' in window) {
        const detector = new BarcodeDetector({ formats:['qr_code'] });
        const scanOnce = async () => {
          if (!videoRef.current) return;
          const codes = await detector.detect(videoRef.current);
          if (codes.length && await handleScannedValue(codes[0].rawValue)) return;
          window.setTimeout(scanOnce, 700);
        };
        window.setTimeout(scanOnce, 900);
        return;
      }

      const jsQR = await loadQrDecoder();
      const scanWithCanvas = async () => {
        const video = videoRef.current;
        const canvas = scanCanvasRef.current;
        if (!video || !canvas) return;
        if (video.readyState < 2 || !video.videoWidth || !video.videoHeight) {
          window.setTimeout(scanWithCanvas, 350);
          return;
        }
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        const context = canvas.getContext('2d', { willReadFrequently:true });
        context.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
        const result = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts:'attemptBoth' });
        if (result?.data && await handleScannedValue(result.data)) return;
        window.setTimeout(scanWithCanvas, 350);
      };
      window.setTimeout(scanWithCanvas, 900);
    } catch (err) {
      stopScanning();
      setScanMessage(err?.name === 'NotAllowedError'
        ? 'Camera permission was denied. Allow camera access or use Manual Member ID.'
        : 'Camera QR scan could not start. Use Manual Member ID.');
    }
  };

  if (!isAdmin) {
    return <MemberPortalPage user={user} onLogout={onLogout}/>;
  }

  if (staffView === 'add-member') {
    return <AddMemberPage onCreated={createMember} onCancel={() => setStaffView('dashboard')}/>;
  }

  return (
    <div className="page-shell pixel-bg">
      <div className="page-inner">
        <div className="page-header" style={{display:'flex',alignItems:'flex-end',justifyContent:'space-between',gap:18,flexWrap:'wrap'}}>
          <div>
            <h1 style={{fontSize:36,fontWeight:800,letterSpacing:'0',marginBottom:8}}>Membership</h1>
            <p style={{color:'#888',fontSize:15}}>Search members, scan QR codes, add packages, and check members into tables.</p>
          </div>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            <button onClick={() => setStaffView('add-member')} style={{background:T.accentRed,color:'#fff',border:'none',borderRadius:8,padding:'10px 14px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Add Member</button>
            <button onClick={() => search('')} style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:'10px 14px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>
              {loading ? 'Loading' : 'Refresh'}
            </button>
          </div>
        </div>

        {message && <div style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:'10px 14px',marginBottom:16,color:'#666',fontSize:13,fontWeight:700}}>{message}</div>}

        <div className="membership-grid" style={{display:'grid',gridTemplateColumns:'minmax(300px, 0.9fr) minmax(320px, 1.1fr)',gap:18,alignItems:'start'}}>
          <section style={{display:'grid',gap:14}}>
            <div style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:18}}>
              <div style={{fontSize:12,letterSpacing:'.08em',textTransform:'uppercase',color:'#aaa',fontWeight:800,marginBottom:12}}>Find Member</div>
              <div style={{display:'flex',gap:8,marginBottom:12}}>
                <input value={query} onChange={e=>setQuery(e.target.value)} onKeyDown={e=>e.key==='Enter'&&search(query)} placeholder="Name, phone, or Member ID" style={inputStyle}/>
                <button onClick={() => search(query)} style={{background:T.accentRed,color:'#fff',border:'none',borderRadius:8,padding:'0 14px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Search</button>
              </div>
              <label style={{display:'block',fontSize:12,fontWeight:800,color:'#555',marginBottom:6}}>Manual Member ID</label>
              <div style={{display:'flex',gap:8}}>
                <input value={manualMemberCode} onChange={e=>setManualMemberCode(e.target.value)} placeholder="FL00000000" style={inputStyle}/>
                <button onClick={() => { setQuery(manualMemberCode); search(manualMemberCode); }} style={{background:'#1A1A18',color:'#fff',border:'none',borderRadius:8,padding:'0 12px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Lookup</button>
              </div>
            </div>

            <div id="qr-scanner" style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:18}}>
              <div style={{display:'flex',justifyContent:'space-between',gap:12,alignItems:'center',marginBottom:12}}>
                <div>
                  <div style={{fontSize:12,letterSpacing:'.08em',textTransform:'uppercase',color:'#aaa',fontWeight:800}}>QR Scanner</div>
                  <div style={{fontSize:12,color:'#888',marginTop:3}}>{scanMessage}</div>
                </div>
                <button onClick={startCameraScan} style={{background:T.accentOrange,color:'#fff',border:'none',borderRadius:8,padding:'9px 12px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>{scanning ? 'Scanning' : 'Scan QR'}</button>
              </div>
              <video ref={videoRef} autoPlay muted playsInline style={{width:'100%',maxHeight:180,background:'#f8f7f4',borderRadius:8,display:scanning?'block':'none',objectFit:'cover'}}/>
              <canvas ref={scanCanvasRef} style={{display:'none'}}/>
            </div>

            <div style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:14,maxHeight:360,overflow:'auto'}}>
              {members.length === 0 && <div style={{fontSize:13,color:'#999',padding:10}}>No members found.</div>}
              {members.map(member => (
                <button key={member.id} onClick={() => selectMember(member)} style={{
                  width:'100%',textAlign:'left',background:selected?.id===member.id?`${T.accentRed}12`:'#fff',
                  border:'1px solid #F0EDEA',borderRadius:8,padding:12,marginBottom:8,cursor:'pointer',fontFamily:'inherit'
                }}>
                  <div style={{fontWeight:800,color:'#1A1A18'}}>{member.name}</div>
                  <div style={{fontFamily:'Space Mono,monospace',fontSize:12,color:'#777',marginTop:3}}>{member.member_code ? `${member.member_code} · ${member.phone}` : 'Account only'}</div>
                  <div style={{fontSize:12,color:T.accentRed,fontWeight:800,marginTop:4}}>{member.member_code ? `${formatHours(member.remaining_seconds)} remaining` : 'Account only · promotion available'}</div>
                </button>
              ))}
            </div>
          </section>

          <section style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:20,minHeight:500}}>
            {!selected ? (
              <div style={{height:'100%',display:'flex',alignItems:'center',justifyContent:'center',color:'#999',fontWeight:700}}>Select a member.</div>
            ) : (
              <div>
                <div style={{display:'flex',justifyContent:'space-between',gap:18,alignItems:'flex-start',marginBottom:18,flexWrap:'wrap'}}>
                  <div>
                    <h2 style={{fontSize:28,fontWeight:800,marginBottom:5}}>{selected.name}</h2>
                    <div style={{fontFamily:'Space Mono,monospace',color:'#666',fontWeight:700}}>{selected.member_code || 'Account only'}</div>
                    {selected.phone && <div style={{color:'#777',fontSize:13,marginTop:4}}>{selected.phone}</div>}
                  </div>
                  <div style={{background:`${T.accentRed}12`,border:`1px solid ${T.accentRed}30`,borderRadius:8,padding:'12px 14px',minWidth:150}}>
                    <div style={{fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',color:'#B95B6B',fontWeight:800}}>{selected.member_code ? 'Remaining' : 'Capability'}</div>
                    <div style={{fontFamily:'Space Mono,monospace',fontSize:selected.member_code?24:14,fontWeight:800,color:T.accentRed}}>{selected.member_code ? formatHours(selected.remaining_seconds) : 'Account only'}</div>
                  </div>
                </div>

                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(220px, 1fr))',gap:14,marginBottom:18}}>
                  {selected.member_code && <div style={{border:'1px solid #F0EDEA',borderRadius:8,padding:14}}>
                    <div style={{fontSize:12,fontWeight:800,color:'#555',marginBottom:10}}>Public Balance Link</div>
                    <input readOnly value={selected.balance_access_token ? window.location.origin + '/member/' + selected.balance_access_token : ''} placeholder="Regenerate to create a balance link" style={{...inputStyle,marginBottom:8,fontFamily:'Space Mono,monospace',fontSize:11}}/>
                    <div style={{display:'grid',gap:8}}>
                      <button onClick={copyBalanceLink} disabled={!selected.balance_access_token} style={{background:selected.balance_access_token?'#1A1A18':'#E8E6E1',color:selected.balance_access_token?'#fff':'#888',border:'none',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:selected.balance_access_token?'pointer':'default'}}>Copy Link</button>
                      <button onClick={downloadBalanceQr} disabled={!selected.balance_access_token} style={{background:selected.balance_access_token?T.accentOrange:'#E8E6E1',color:selected.balance_access_token?'#fff':'#888',border:'none',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:selected.balance_access_token?'pointer':'default'}}>Download QR</button>
                      <button onClick={regenerateBalanceLink} style={{background:'#fff',color:'#B45309',border:'1px solid #F2C47F',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Regenerate Link</button>
                    </div>
                  </div>}
                  {!selected.member_code ? (
                  <div style={{border:'1px solid #F0EDEA',borderRadius:8,padding:14}}>
                    <div style={{fontSize:12,fontWeight:800,color:'#555',marginBottom:10}}>Add Membership Capability</div>
                    <div style={{display:'grid',gap:8}}>
                      <input value={promotionPhone} onChange={e=>setPromotionPhone(e.target.value)} placeholder="+61 412 345 678" type="tel" style={inputStyle}/>
                      <button onClick={promoteMembership} style={{background:T.accentRed,color:'#fff',border:'none',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Promote to Member</button>
                    </div>
                  </div>
                  ) : <div style={{border:'1px solid #F0EDEA',borderRadius:8,padding:14}}>
                    <div style={{fontSize:12,fontWeight:800,color:'#555',marginBottom:10}}>Member Profile</div>
                    <div style={{display:'grid',gap:8}}>
                      <input value={editForm.name} onChange={e=>setEditForm(prev=>({...prev,name:e.target.value}))} placeholder="Name" style={inputStyle}/>
                      <input value={editForm.phone} onChange={e=>setEditForm(prev=>({...prev,phone:e.target.value}))} placeholder="+61 412 345 678" type="tel" style={inputStyle}/>
                      <input value={editForm.password} onChange={e=>setEditForm(prev=>({...prev,password:e.target.value}))} placeholder="New password (optional)" type="password" style={inputStyle}/>
                      <textarea value={editForm.notes} onChange={e=>setEditForm(prev=>({...prev,notes:e.target.value}))} placeholder="Staff notes" rows="2" style={{...inputStyle,resize:'vertical'}}/>
                      <label style={{display:'flex',alignItems:'center',gap:8,fontSize:12,fontWeight:800,color:'#555'}}>
                        <input type="checkbox" checked={editForm.is_active} onChange={e=>setEditForm(prev=>({...prev,is_active:e.target.checked}))}/>
                        Active membership
                      </label>
                      <button onClick={saveMember} style={{background:'#1A1A18',color:'#fff',border:'none',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Save Member</button>
                      <button onClick={removeMembership} style={{background:'#fff',color:'#B42318',border:'1px solid #F0B4AE',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Remove Membership</button>
                      {!selected.is_admin && <button onClick={deleteMember} style={{background:'#B42318',color:'#fff',border:'none',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Deactivate Member</button>}
                    </div>
                  </div>}

                  <div style={{border:'1px solid #F0EDEA',borderRadius:8,padding:14}}>
                    <div style={{fontSize:12,fontWeight:800,color:'#555',marginBottom:10}}>Add Package</div>
                    <div style={{display:'grid',gap:8}}>
                      <input value={packageForm.package_name} onChange={e=>setPackageForm(prev=>({...prev,package_name:e.target.value}))} style={inputStyle}/>
                      <input value={packageForm.hours} onChange={e=>setPackageForm(prev=>({...prev,hours:e.target.value}))} type="number" min="0.5" step="0.5" style={inputStyle}/>
                      <button onClick={addPackage} style={{background:T.accentRed,color:'#fff',border:'none',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Add Hours</button>
                    </div>
                  </div>

                  <div style={{border:'1px solid #F0EDEA',borderRadius:8,padding:14}}>
                    <div style={{fontSize:12,fontWeight:800,color:'#555',marginBottom:10}}>Table Check-in</div>
                    <div style={{display:'grid',gap:8}}>
                      <select value={checkInTable} onChange={e=>setCheckInTable(e.target.value)} style={inputStyle}>
                        {Array.from({length:14}, (_,i)=>i+1).map(number => {
                          const table = tables.find(row => row.table_number === number);
                          return <option key={number} value={number}>Table {number}{table?.is_running ? ' - attach member' : ' - start timer'}</option>;
                        })}
                      </select>
                      <button onClick={checkInMember} style={{background:'#1A1A18',color:'#fff',border:'none',borderRadius:8,padding:'10px 12px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Check In</button>
                    </div>
                  </div>

                  <div style={{border:'1px solid #F0EDEA',borderRadius:8,padding:14,textAlign:'center'}}>
                    <div style={{fontSize:12,fontWeight:800,color:'#555',marginBottom:10}}>QR Code</div>
                    {selectedQrUrl ? (
                      <img src={selectedQrUrl} alt="Member QR code" style={{width:136,height:136,objectFit:'contain',border:'1px solid #F0EDEA',borderRadius:8}}/>
                    ) : (
                      <div style={{width:136,height:136,display:'inline-flex',alignItems:'center',justifyContent:'center',border:'1px solid #F0EDEA',borderRadius:8,color:'#999',fontSize:12}}>QR</div>
                    )}
                  </div>
                </div>

                <div style={{display:'grid',gridTemplateColumns:'repeat(auto-fit, minmax(260px, 1fr))',gap:14}}>
                  <div>
                    <h3 style={{fontSize:16,fontWeight:800,marginBottom:10}}>Purchase and Package History</h3>
                    <div style={{display:'grid',gap:8}}>
                      {(selected.packages || []).length === 0 && <div style={{fontSize:13,color:'#999'}}>No packages yet.</div>}
                      {(selected.packages || []).map(pkg => (
                        <div key={pkg.id} style={{borderTop:'1px solid #F0EDEA',paddingTop:10}}>
                          <div style={{fontWeight:800}}>{pkg.package_name}</div>
                          <div style={{fontFamily:'Space Mono,monospace',fontSize:12,color:T.accentRed}}>{formatHours(pkg.remaining_seconds)} / {formatHours(pkg.total_seconds)}</div>

function MemberPortalPage({ user, embedded = false, onLogout } = {}) {
  const hasMembership = !!user?.member_code;
  const [member, setMember] = useState(null);
  const [packages, setPackages] = useState([]);
  const [visits, setVisits] = useState([]);
  const [qrUrl, setQrUrl] = useState('');
  const memberLoadGenerationRef = useRef(0);
  const currentAccountIdRef = useRef(user?.id);
  const qrUrlRef = useRef('');
  currentAccountIdRef.current = user?.id;

  const replaceQrUrl = useCallback(nextUrl => {
    if (qrUrlRef.current && qrUrlRef.current !== nextUrl) {
      URL.revokeObjectURL(qrUrlRef.current);
    }
    qrUrlRef.current = nextUrl;
    setQrUrl(nextUrl);
  }, []);

  const loadMemberData = useCallback(async (accountId, generation) => {
    const isCurrentLoad = () => (
      memberLoadGenerationRef.current === generation
      && currentAccountIdRef.current === accountId
    );
    const me = await apiFetch('/members/me');
    if (!me?.ok) return;
    const profile = await me.json();
    if (!isCurrentLoad()) return;
    setMember(profile);
    const [packageRes, visitRes, qrRes] = await Promise.all([
      apiFetch('/members/me/packages'),
      apiFetch('/members/me/visits'),
      apiFetch('/members/me/qr'),
    ]);
    if (!isCurrentLoad()) return;
    const [packageData, visitData, qrBlob] = await Promise.all([
      packageRes?.ok ? packageRes.json() : null,
      visitRes?.ok ? visitRes.json() : null,
      qrRes?.ok ? qrRes.blob() : null,
    ]);
    if (packageData !== null) {
      if (!isCurrentLoad()) return;
      setPackages(packageData);
    }
    if (visitData !== null) {
      if (!isCurrentLoad()) return;
      setVisits(visitData);
    }
    if (qrBlob) {
      if (!isCurrentLoad()) return;
      const nextQrUrl = URL.createObjectURL(qrBlob);
      if (!isCurrentLoad()) {
        URL.revokeObjectURL(nextQrUrl);
        return;
      }
      replaceQrUrl(nextQrUrl);
    }
  }, [replaceQrUrl]);

  useEffect(() => {
    return () => {
      memberLoadGenerationRef.current += 1;
      if (qrUrlRef.current) URL.revokeObjectURL(qrUrlRef.current);
      qrUrlRef.current = '';
    };
  }, []);

  useEffect(() => {
    const accountId = user?.id;
    const generation = ++memberLoadGenerationRef.current;
    setMember(null);
    setPackages([]);
    setVisits([]);
    replaceQrUrl('');
    if (hasMembership && accountId) loadMemberData(accountId, generation);
    return () => {
      if (memberLoadGenerationRef.current === generation) {
        memberLoadGenerationRef.current += 1;
      }
    };
  }, [hasMembership, loadMemberData, replaceQrUrl, user?.id]);

  const logout = () => {
    memberLoadGenerationRef.current += 1;
    onLogout?.();
  };

  const membershipStatus = () => {
    if (!user) {
      return (
        <section style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:22}}>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:10}}>Sign in to view Membership</h2>
          <p style={{color:'#777',lineHeight:1.7}}>Use the Member Sign In button in the site header to sign in to your existing account.</p>
        </section>
      );
    }
    if (!hasMembership) {
      return (
        <section role="status" style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:22}}>
          <h2 style={{fontSize:22,fontWeight:800,marginBottom:10}}>Membership profile required</h2>
          <p style={{color:'#777',lineHeight:1.7}}>Membership profile required. Ask an administrator to add a phone number and Member ID to this account.</p>
        </section>
      );
    }
    if (!member) {
      return (
        <section role="status" style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:22}}>
          <Spinner size={18}/> Loading membership profile...
        </section>
      );
    }
    return null;
  };

  const status = membershipStatus();

  const content = (
      <div className="page-inner" style={{maxWidth:980}}>
        <div className="page-header">
          <h1 style={{fontSize:36,fontWeight:800,letterSpacing:'0',marginBottom:8}}>My Membership</h1>
          <p style={{color:'#888',fontSize:15}}>View your QR code, remaining package hours, purchase history, and visit history.</p>
        </div>

        {status || (
          <div className="member-profile-grid" style={{display:'grid',gridTemplateColumns:'minmax(260px, 340px) 1fr',gap:18,alignItems:'start'}}>
            <aside style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:22,textAlign:'center'}}>
              <h2 style={{fontSize:26,fontWeight:800,marginBottom:5}}>{member.name}</h2>
              <div style={{fontFamily:'Space Mono,monospace',color:'#666',fontWeight:700,marginBottom:14}}>{member.member_code}</div>
              {qrUrl && <img src={qrUrl} alt="Member QR code" style={{width:210,height:210,objectFit:'contain',border:'1px solid #F0EDEA',borderRadius:8,marginBottom:14}}/>}
              <div style={{background:`${T.accentRed}12`,borderRadius:8,padding:14,marginBottom:14}}>
                <div style={{fontSize:10,letterSpacing:'.08em',textTransform:'uppercase',color:'#B95B6B',fontWeight:800}}>Remaining Hours</div>
                <div style={{fontFamily:'Space Mono,monospace',fontSize:28,fontWeight:800,color:T.accentRed}}>{formatHours(member.remaining_seconds)}</div>
              </div>
              <button onClick={logout} style={{background:'#f2f1ee',color:'#555',border:'none',borderRadius:8,padding:'10px 16px',fontWeight:800,fontFamily:'inherit',cursor:'pointer'}}>Sign out</button>
            </aside>

            <section style={{display:'grid',gap:18}}>
              <div style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:20}}>
                <h3 style={{fontSize:18,fontWeight:800,marginBottom:12}}>Purchase and Package History</h3>
                <div style={{display:'grid',gap:8}}>
                  {packages.length === 0 && <div style={{fontSize:13,color:'#999'}}>No packages yet.</div>}
                  {packages.map(pkg => (
                    <div key={pkg.id} style={{display:'grid',gridTemplateColumns:'1fr auto',gap:12,borderTop:'1px solid #F0EDEA',paddingTop:10}}>
                      <div>
                        <div style={{fontWeight:800}}>{pkg.package_name}</div>
                        <div style={{fontSize:12,color:'#888'}}>{pkg.purchased_at ? formatDateTime(pkg.purchased_at) : 'Package purchase'}</div>
                      </div>
                      <div style={{fontFamily:'Space Mono,monospace',fontWeight:800,color:T.accentRed}}>{formatHours(pkg.remaining_seconds)}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div style={{background:'#fff',border:'1px solid #E8E6E1',borderRadius:8,padding:20}}>
                <h3 style={{fontSize:18,fontWeight:800,marginBottom:12}}>Visit History</h3>
                <div style={{display:'grid',gap:8}}>
                  {visits.length === 0 && <div style={{fontSize:13,color:'#999'}}>No visits yet.</div>}
                  {visits.map(visit => (
                    <div key={visit.id} style={{display:'grid',gridTemplateColumns:'1fr auto',gap:12,borderTop:'1px solid #F0EDEA',paddingTop:10}}>
                      <div>
                        <div style={{fontWeight:800}}>Table {visit.table_number}</div>
                        <div style={{fontSize:12,color:'#888'}}>{formatDateTime(visit.checked_in_at)} to {formatDateTime(visit.checked_out_at)}</div>
                      </div>
                      <div style={{textAlign:'right'}}>
                        <div style={{fontFamily:'Space Mono,monospace',fontWeight:800,color:T.accentRed}}>{formatDuration(visit.charged_seconds)}</div>
                        {visit.extra_due_seconds > 0 && <div style={{fontSize:12,color:'#B45309',fontWeight:800}}>Due {formatDuration(visit.extra_due_seconds)}</div>}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </section>
          </div>
        )}
      </div>
  );

  if (embedded) return content;

  return (
    <div className="page-shell pixel-bg">
      {content}
    </div>
  );
}

// ─── LOGIN MODAL ──────────────────────────────────────────────────────────────
function LoginModal({ onClose, onLogin }) {
  const [form, setForm] = useState({ identifier:'', password:'' });
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const firstInputRef = useRef(null);

  useEffect(() => {
    firstInputRef.current?.focus();
    const closeOnEscape = event => {
      if (event.key === 'Escape') onClose();
    };
    document.addEventListener('keydown', closeOnEscape);
    return () => document.removeEventListener('keydown', closeOnEscape);
  }, [onClose]);

  const readError = async (res, fallback) => {
    try { return (await res.json())?.detail || fallback; } catch (_) { return fallback; }
  };

  const submit = async () => {
    if (!form.identifier.trim() || !form.password) {
      setError('Please fill in all fields');
      return;
    }
    setLoading(true);
    setError('');
    try {
      const res = await apiFetch('/auth/login', {
        method:'POST',
        body:JSON.stringify({ identifier:form.identifier, password:form.password }),
      });
      if (!res) {
        setError('Cannot reach the server. Run: docker compose up --build');
        return;
      }
      if (!res.ok) {
        setError(await readError(res, 'Invalid email, phone, Member ID, or password.'));
        return;
      }
      const data = await res.json();
      onLogin(data.user, data.access_token);
      onClose();
    } catch (err) {
      setError('Unexpected error: ' + (err?.message || String(err)));
    } finally {
      setLoading(false);
    }
  };

  const inputStyle = {
    width:'100%',border:'2px solid #e8e6e1',borderRadius:8,padding:'10px 14px',
    fontSize:14,fontFamily:'inherit',outline:'none',background:'#fafaf8',transition:'border-color 0.15s'
  };

  return (
    <div style={{position:'fixed',inset:0,background:'rgba(26,26,24,0.6)',backdropFilter:'blur(6px)',zIndex:300,display:'flex',alignItems:'center',justifyContent:'center'}} onClick={onClose}>
      <div className="scale-in" role="dialog" aria-modal="true" aria-labelledby="login-title" onClick={e=>e.stopPropagation()} style={{position:'relative',background:'#fff',borderRadius:20,width:'min(420px, calc(100vw - 32px))',maxHeight:'calc(100dvh - 32px)',overflowY:'auto',padding:36,boxShadow:'0 24px 80px rgba(0,0,0,0.2)'}}>
        <button type="button" onClick={onClose} aria-label="Close sign in" style={{position:'absolute',top:14,right:14,width:34,height:34,border:'1px solid #E8E6E1',borderRadius:8,background:'#fff',color:'#6F666B',fontSize:22,lineHeight:1,cursor:'pointer'}}>&times;</button>
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:18,justifyContent:'center'}}>
          <div style={{width:40,height:40,borderRadius:8,overflow:'hidden',flexShrink:0}}>
            <img src="/logo.jpg" style={{width:'100%',height:'100%',objectFit:'cover'}} alt="FunLab AU" onError={e=>e.target.style.display='none'}/>
          </div>
          <span style={{fontWeight:800,fontSize:18}}><span style={{color:'#F47A8A'}}>Fun</span><span style={{color:'#6BB5E8'}}>Lab</span> <span style={{color:'#9B8FCF',fontSize:14,fontWeight:600}}>AU</span></span>
        </div>
        <h2 id="login-title" style={{fontSize:22,fontWeight:800,textAlign:'center',marginBottom:6}}>Welcome back</h2>
        <p style={{color:'#777',fontSize:13,textAlign:'center',marginBottom:18}}>Sign in to your account.</p>

        {[
          {id:'login-identifier',label:'Email, phone, or Member ID',type:'text',key:'identifier',placeholder:'you@example.com or FL00000000',autoComplete:'username'},
          {id:'login-password',label:'Password',type:'password',key:'password',placeholder:'Password',autoComplete:'current-password'},
        ].map((f,index)=>(
          <div key={f.label} style={{marginBottom:14}}>
            <label htmlFor={f.id} style={{display:'block',fontSize:12,fontWeight:600,color:'#555',marginBottom:6}}>{f.label}</label>
            <input id={f.id} ref={index === 0 ? firstInputRef : undefined} type={f.type} value={form[f.key]} onChange={e=>setForm(prev=>({...prev,[f.key]:e.target.value}))} placeholder={f.placeholder} autoComplete={f.autoComplete}
              onKeyDown={e=>e.key==='Enter'&&submit()}
              style={inputStyle}
              onFocus={e=>e.target.style.borderColor=T.accentRed}
              onBlur={e=>e.target.style.borderColor='#e8e6e1'}/>
          </div>
        ))}

        {error && <div style={{background:'#FEE2E2',border:'1px solid #FCA5A5',borderRadius:8,padding:'8px 12px',fontSize:12,color:'#991B1B',marginBottom:12}}>{error}</div>}

        <button onClick={submit} disabled={loading} style={{
          width:'100%',marginTop:4,
          background:loading?'#e8e6e1':`linear-gradient(135deg, ${T.accentRed}, ${T.accentOrange})`,
          color:loading?'#aaa':'#fff',border:'none',borderRadius:10,padding:'13px 0',
          fontWeight:700,fontSize:14,cursor:loading?'default':'pointer',fontFamily:'inherit',transition:'all 0.2s',
          display:'flex',alignItems:'center',justifyContent:'center',gap:8
        }}>
          {loading ? <><Spinner size={14}/> Signing in...</> : 'Sign In'}
        </button>

      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function getInitialPage() {
  const queryPage = new URLSearchParams(window.location.search).get('page');
  const allowed = new Set(['home', 'gallery', 'favorites', 'timetable', 'membership', 'admin']);
  if (allowed.has(queryPage)) return queryPage;
  const storedPage = localStorage.getItem('pc_page');
  return allowed.has(storedPage) ? storedPage : 'home';
}

function App() {
  const [page, setPage] = useState(getInitialPage);
  const [patterns, setPatterns] = useState([]);
  const [patternsLoading, setPatternsLoading] = useState(true);
  const [favIds, setFavIds] = useState(new Set());
  const [user, setUser] = useState(null);
  const [authLoading, setAuthLoading] = useState(true);
  const [showLogin, setShowLogin] = useState(false);
  const [openPattern, setOpenPattern] = useState(null);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const [notification, setNotification] = useState(null);

  const notify = useCallback((message, tone = 'info') => {
    setNotification({ id: Date.now(), message, tone });
  }, []);

  useEffect(() => {
    if (!notification) return;
    const notificationId = notification.id;
    const timer = window.setTimeout(() => {
      setNotification(current => current?.id === notificationId ? null : current);
    }, 4200);
    return () => window.clearTimeout(timer);
  }, [notification]);

  const loadPatterns = useCallback(async () => {
    setPatternsLoading(true);
    try {
      const res = await apiFetch('/patterns');
      const data = res?.ok ? await res.json() : null;
      if (data) {
        setPatterns(data.map(normalizePattern));
      } else {
        notify('Could not load the pattern library. Please try again.', 'error');
      }
    } finally {
      setPatternsLoading(false);
    }
  }, [notify]);

  const loadFavIds = useCallback(async () => {
    const res = await apiFetch('/favorites/ids');
    if (res?.ok) {
      const ids = await res.json();
      setFavIds(new Set(ids));
    }
  }, []);

  // Validate the one shared account session on mount.
  useEffect(() => {
    const token = localStorage.getItem('pc_token');
    if (!token) { setAuthLoading(false); return; }
    apiFetch('/auth/me').then(async res => {
      if (res?.ok) {
        const account = await res.json();
        setUser(storeAccountSession(account, token));
        loadFavIds();
      } else {
        clearAccountSession();
        notify(res ? 'Your session expired. Please sign in again.' : 'Could not verify your session. Please sign in again.', 'error');
      }
    }).catch(() => {
      clearAccountSession();
      notify('Could not verify your session. Please sign in again.', 'error');
    })
      .finally(() => setAuthLoading(false));
  }, [loadFavIds, notify]);

  useEffect(() => { loadPatterns(); }, [loadPatterns]);
  useEffect(() => {
    if (!authLoading && page === 'admin' && !user?.is_admin) setPage('gallery');
  }, [authLoading, page, user?.is_admin]);
  useEffect(() => { localStorage.setItem('pc_page', page); }, [page]);
  useEffect(() => { setMobileMenuOpen(false); }, [page]);
  useEffect(() => {
    const previousOverflow = document.body.style.overflow;
    if (mobileMenuOpen) document.body.style.overflow = 'hidden';
    return () => { document.body.style.overflow = previousOverflow; };
  }, [mobileMenuOpen]);

  const onFave = async (id) => {
    if (!user) { setShowLogin(true); return; }
    // Optimistic update
    const wasFaved = favIds.has(id);
    setFavIds(prev => {
      const next = new Set(prev);
      wasFaved ? next.delete(id) : next.add(id);
      return next;
    });
    setPatterns(prev => prev.map(p => p.id === id
      ? { ...p, faves: wasFaved ? p.faves - 1 : p.faves + 1, faves_count: wasFaved ? p.faves_count - 1 : p.faves_count + 1 }
      : p
    ));
    const res = await apiFetch(`/favorites/${id}`, { method: 'POST' });
    if (!res?.ok) {
      // Revert on failure
      setFavIds(prev => { const next = new Set(prev); wasFaved ? next.add(id) : next.delete(id); return next; });
      setPatterns(prev => prev.map(p => p.id === id
        ? { ...p, faves: wasFaved ? p.faves + 1 : p.faves - 1, faves_count: wasFaved ? p.faves_count + 1 : p.faves_count - 1 }
        : p
      ));
      notify('Unable to update favorites. Please try again.', 'error');
    }
  };

  const onOpen = async (pattern) => {
    // Fetch full pattern with grid_data
    const res = await apiFetch(`/patterns/${pattern.id}`);
    if (res?.ok) {
      setOpenPattern(normalizePattern(await res.json()));
    } else {
      setOpenPattern(pattern);
      notify('Could not load the full pattern. Showing the available preview.', 'error');
    }
  };

  const onDeletePattern = async (id) => {
    const res = await apiFetch(`/patterns/${id}`, { method: 'DELETE' });
    if (!res?.ok) {
      notify('Unable to delete this pattern. Please try again.', 'error');
      return;
    }
    setPatterns(prev => prev.filter(p => p.id !== id));
    setFavIds(prev => {
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
    setOpenPattern(prev => prev?.id === id ? null : prev);
    notify('Pattern deleted.', 'success');
  };

  const onLogin = (userData, token) => {
    setUser(storeAccountSession(userData, token));
    loadFavIds();
    notify(`Signed in as ${userData.name}.`, 'success');
  };

  const onLogout = () => {
    clearAccountSession();
    setUser(null);
    setFavIds(new Set());
    if (page === 'admin') setPage('gallery');
    notify('Signed out.', 'success');
  };

  if (authLoading) {
    return (
      <div style={{height:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'#FEF4F5'}}>
        <Spinner size={32} color={T.accentRed}/>
      </div>
    );
  }

  return (
    <div style={{minHeight:'100vh',background:T.bgColor}}>
      <Navbar
        page={page}
        setPage={setPage}
        user={user}
        onLoginClick={() => setShowLogin(true)}
        onLogout={onLogout}
        onMobileMenuClick={() => setMobileMenuOpen(true)}
        mobileMenuOpen={mobileMenuOpen}
      />
      <MobileNavDrawer
        page={page}
        setPage={setPage}
        user={user}
        onLoginClick={() => setShowLogin(true)}
        onLogout={onLogout}
        open={mobileMenuOpen}
        onClose={() => setMobileMenuOpen(false)}
      />

      <main className="app-content">
      {page === 'home' && (
        <OfficialHome setPage={setPage} onLoginClick={() => setShowLogin(true)}/>
      )}
      {page === 'gallery' && (
        <GalleryPage patterns={patterns} loading={patternsLoading} favIds={favIds} onFave={onFave} onOpen={onOpen} user={user} onPatternDeleted={onDeletePattern}/>
      )}
      {page === 'favorites' && (
        <FavoritesPage patterns={patterns} favIds={favIds} onFave={onFave} onOpen={onOpen} user={user} onLoginClick={() => setShowLogin(true)}/>
      )}
      {page === 'timetable' && (
        <TimeTablePage user={user}/>
      )}
      {page === 'membership' && (
        <MembershipPage user={user} onLogout={onLogout}/>
      )}
      {page === 'admin' && user?.is_admin && (
        <AdminPage onPatternPublished={loadPatterns}/>
      )}
      </main>

      <AppNotification notification={notification} onDismiss={() => setNotification(null)}/>

      {openPattern && (
        <BeadMapViewer pattern={openPattern} onClose={() => setOpenPattern(null)} user={user} notify={notify}/>
      )}
      {showLogin && (
        <LoginModal onClose={() => setShowLogin(false)} onLogin={onLogin}/>
      )}
    </div>
  );
}

const isPublicMemberBalanceRoute = window.location.pathname.startsWith('/member/');
const publicMemberBalanceToken = window.location.pathname.split('/').filter(Boolean).pop();
ReactDOM.createRoot(document.getElementById('root')).render(
  isPublicMemberBalanceRoute
    ? <PublicMemberBalancePage token={publicMemberBalanceToken}/>
    : <App/>
);
</script>
</body>
</html>
