server {
    listen 80;
    server_name _;

    # Allow up to 20 MB uploads (image files)
    client_max_body_size 20M;

    # Proxy all /api/* calls to the FastAPI backend
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # Long timeout for image processing (OCR can take a while)
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }

    # Serve uploaded files through the backend
    location /uploads/ {
        proxy_pass       http://backend:8000/uploads/;
        proxy_set_header Host $host;
    }

    # Static frontend — all unmatched paths fall back to index.html (SPA routing)
    location / {
        root       /usr/share/nginx/html;
        try_files  $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
