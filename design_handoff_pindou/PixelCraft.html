const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentRed": "#f47a8a",
  "accentOrange": "#6bb5e8",
  "bgColor": "#FEF4F5",
  "cardRadius": 8,
  "fontBody": "Space Grotesk"
}/*EDITMODE-END*/;

function useTweaks() {
  const [t, setT] = useState(TWEAK_DEFAULTS);
  useEffect(() => {
    const panel = document.getElementById('tweaks-panel');
    const applyCSS = (vals) => {
      document.body.style.fontFamily = `'${vals.fontBody}', sans-serif`;
      document.documentElement.style.setProperty('--accent', vals.accentRed);
      document.documentElement.style.setProperty('--orange', vals.accentOrange);
      document.documentElement.style.setProperty('--bg', vals.bgColor);
      document.documentElement.style.setProperty('--radius', vals.cardRadius + 'px');
    };
    applyCSS(t);

    const onMsg = (e) => {
      if (e.data?.type === '__activate_edit_mode') panel.classList.add('visible');
      if (e.data?.type === '__deactivate_edit_mode') panel.classList.remove('visible');
    };
    window.addEventListener('message', onMsg);

    const sync = () => {
      const r = document.getElementById('tw-red')?.value || t.accentRed;
      const o = document.getElementById('tw-orange')?.value || t.accentOrange;
      const rad = parseInt(document.getElementById('tw-radius')?.value || t.cardRadius);
      const f = document.getElementById('tw-font')?.value || t.fontBody;
      document.getElementById('tw-radius-val').textContent = rad + 'px';
      const next = { accentRed: r, accentOrange: o, bgColor: t.bgColor, cardRadius: rad, fontBody: f };
      applyCSS(next);
      setT(next);
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
    };
    ['tw-red','tw-orange','tw-radius','tw-font'].forEach(id => {
      document.getElementById(id)?.addEventListener('input', sync);
    });

    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);
  return t;
}

function generateGrid(w, h, palette) {
  return Array.from({length: h}, (_, y) =>
    Array.from({length: w}, (_, x) => {
      const i = Math.floor((Math.sin(x*0.7 + y*0.5)*0.5+0.5) * palette.length);
      return palette[i % palette.length].id;

  );
}

// ─── PIXEL THUMBNAIL ───────────────────────────────────────────────────────────
function PixelThumb({ color, size = 80 }) {
  const ref = useRef();
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const cols = 8, rows = 8;
    const cw = size/cols, ch = size/rows;
    const hsl = color;
    for (let y = 0; y < rows; y++) {
      for (let x = 0; x < cols; x++) {
        const t = Math.sin(x*1.2+y*0.8)*0.4+0.6;
        ctx.fillStyle = color;
        ctx.globalAlpha = 0.2 + t*0.75;
        ctx.fillRect(x*cw, y*ch, cw-1, ch-1);
      }
    }
  }, [color, size]);
  return <canvas ref={ref} width={size} height={size} style={{imageRendering:'pixelated',borderRadius:4,display:'block'}}/>;
}

function PixelGridPreview({ color, w, h }) {
  const ref = useRef();
  const size = 160;
  useEffect(() => {
    const canvas = ref.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, size, size);
    const cw = size/Math.min(w,20), ch = size/Math.min(h,20);
    const palette = [color, '#fff', `${color}88`, '#f0ede8', `${color}cc`];
    for (let y = 0; y < Math.min(h,20); y++) {
      for (let x = 0; x < Math.min(w,20); x++) {
        const v = (Math.sin(x*1.1+y*0.9)*0.5+0.5);
        ctx.fillStyle = v > 0.6 ? color : v > 0.35 ? `${color}88` : '#f0ede8';
        ctx.fillRect(x*cw+0.5, y*ch+0.5, cw-1, ch-1);
      }
    }
  }, [color, w, h]);
  return <canvas ref={ref} width={size} height={size} style={{imageRendering:'pixelated',opacity:0.9}}/>;
}

        background:'#fff', borderRadius:20, width:'min(920px,95vw)',
        maxHeight:'90vh', overflow:'hidden', display:'flex', flexDirection:'column',
        boxShadow:'0 24px 80px rgba(0,0,0,0.25)'
      }}>

          padding:'18px 24px', borderBottom:'1px solid #f0ede8',
          display:'flex', alignItems:'center', gap:16
        }}>
          <div style={{flex:1}}>
            <h2 style={{fontSize:20,fontWeight:800,letterSpacing:'-0.02em'}}>{pattern.title}</h2>
            <div style={{fontSize:12,color:'#999',marginTop:2,fontFamily:'Space Mono,monospace'}}>
              {pattern.gridW}×{pattern.gridH} beads · {Object.keys(usedColors).length} colors
              {isLoggedIn && ` · ${doneBeads}/${totalBeads} placed`}
            </div>
          </div>
          {/* Progress */}
          {isLoggedIn && (
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:11,color:'#999',marginBottom:4,letterSpacing:'.06em',textTransform:'uppercase'}}>Progress</div>
              <div style={{
                width:120,height:6,background:'#f0ede8',borderRadius:3,overflow:'hidden'
              }}>
                <div style={{
                  width:`${(doneBeads/totalBeads)*100}%`,height:'100%',
                  background:`linear-gradient(90deg, ${tweaks.accentRed}, ${tweaks.accentOrange})`,
                  transition:'width 0.3s'
                }}/>
              </div>
              <div style={{fontSize:11,color:tweaks.accentRed,marginTop:3,fontWeight:700}}>
                {Math.round((doneBeads/totalBeads)*100)}%
              </div>
            </div>
          )}
          {/* Zoom */}
          <div style={{display:'flex',gap:4}}>
            {[0.75,1,1.5,2].map(z=>(
              <button key={z} onClick={()=>setZoom(z)} style={{
                background: zoom===z ? tweaks.accentRed : '#f2f1ee',
                color: zoom===z ? '#fff' : '#555',
                border:'none',borderRadius:6,padding:'5px 9px',
                fontSize:11,cursor:'pointer',fontFamily:'Space Mono,monospace',fontWeight:700
              }}>{z}×</button>
            ))}
          </div>
          <button onClick={onClose} style={{
            background:'#f2f1ee',border:'none',borderRadius:8,width:34,height:34,
            cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',color:'#555'
          }}>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
              <path d="M18 6 6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>

        {/* Body */}
        <div style={{display:'flex', flex:1, overflow:'hidden', minHeight:0}}>
          {/* Grid */}
          <div style={{flex:1, overflow:'auto', padding:24}}>
            {!isLoggedIn && (
              <div style={{
                background:`${tweaks.accentOrange}15`, border:`1px solid ${tweaks.accentOrange}40`,
                borderRadius:10, padding:'10px 16px', marginBottom:16, fontSize:13,
                color:'#8B6914', display:'flex', alignItems:'center', gap:8
              }}>
                <span>🔒</span>
                <span>Sign in to track your progress and cross off placed beads</span>
              </div>
            )}
            <div style={{
              display:'inline-block',
              border:'1px solid #e8e6e1',
              borderRadius:8, overflow:'hidden',
              transform:`scale(${zoom})`, transformOrigin:'top left',
              transition:'transform 0.2s'
            }}>
              {grid.map((row, y) => (
                <div key={y} style={{display:'flex'}}>
                  {row.map((beadId, x) => {
                    const bead = pattern.palette.find(b=>b.id===beadId) || BEAD_PALETTE[0];
                    const key = `${x},${y}`;
                    const done = crossed.has(key);
                    const isHighlighted = highlight === beadId;
                    return (
                      <div key={x}
                        onClick={() => toggle(key)}
                        onMouseEnter={() => setHighlight(beadId)}
                        onMouseLeave={() => setHighlight(null)}
                        style={{
                          width: cellSize, height: cellSize,
                          background: done ? '#f0ede8' : (isHighlighted ? bead.hex : bead.hex),
                          border: '0.5px solid rgba(0,0,0,0.06)',
                          cursor: isLoggedIn ? 'pointer' : 'default',
                          opacity: done ? 0.25 : isHighlighted ? 1 : 0.88,
                          position:'relative', flexShrink:0,
                          transition:'opacity 0.1s',
                          display:'flex', alignItems:'center', justifyContent:'center',
                        }}>
                        {done && (
                          <svg width={cellSize*0.6} height={cellSize*0.6} viewBox="0 0 10 10">
                            <path d="M1.5 5 L4 7.5 L8.5 2.5" stroke="#888" strokeWidth="1.5" fill="none" strokeLinecap="round"/>
                          </svg>
                        )}
                      </div>
                    );
                  })}
                </div>
              ))}
            </div>
          </div>

          {/* Legend */}
          <div style={{
            width:200, borderLeft:'1px solid #f0ede8', padding:'20px 16px',
            overflow:'auto', flexShrink:0
          }}>
            <div style={{
              fontSize:10,letterSpacing:'.1em',textTransform:'uppercase',
              color:'#aaa',fontWeight:700,marginBottom:12
            }}>Color Legend</div>
            {Object.entries(usedColors).map(([id, count]) => {
              const bead = pattern.palette.find(b=>b.id===id);
              if (!bead) return null;
              const done = [...crossed].filter(k => {
                const [cx, cy] = k.split(',').map(Number);
                return grid[cy]?.[cx] === id;
              }).length;
              return (
                <div key={id}
                  onMouseEnter={()=>setHighlight(id)}
                  onMouseLeave={()=>setHighlight(null)}
                  style={{
                    display:'flex',alignItems:'center',gap:8,
                    padding:'6px 8px',borderRadius:8,marginBottom:4,cursor:'pointer',
                    background: highlight===id ? `${bead.hex}20` : 'transparent',
                    transition:'background 0.15s'
                  }}>
                  <div style={{width:18,height:18,borderRadius:4,background:bead.hex,flexShrink:0,border:'1px solid rgba(0,0,0,0.1)'}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:11,fontWeight:600,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{bead.name}</div>
                    <div style={{fontSize:10,color:'#aaa',fontFamily:'Space Mono,monospace'}}>{count} beads</div>
                  </div>
                  {isLoggedIn && done > 0 && (
                    <div style={{fontSize:10,color:tweaks.accentRed,fontWeight:700,fontFamily:'Space Mono,monospace'}}>{done}</div>
                  )}
                </div>
              );
            })}

            <button style={{
              width:'100%', marginTop:16,
              background:`linear-gradient(135deg, ${tweaks.accentRed}, ${tweaks.accentOrange})`,
              color:'#fff', border:'none', borderRadius:8, padding:'10px 0',
              fontWeight:700, fontSize:13, cursor:'pointer', fontFamily:'inherit'
            }}>
              ↓ Download PDF
            </button>
            {isLoggedIn && crossed.size > 0 && (
              <button onClick={()=>setCrossed(new Set())} style={{
                width:'100%', marginTop:8,
                background:'transparent', color:'#bbb', border:'1px solid #e8e6e1',
                borderRadius:8, padding:'8px 0', fontWeight:600, fontSize:12,
                cursor:'pointer', fontFamily:'inherit'
              }}>Reset Progress</button>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

                <div style={{fontSize:13,color:'#666',lineHeight:1.5}}>{tip}</div>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

            <img src="funlab-logo.jpeg" style={{width:'100%',height:'100%',objectFit:'cover'}} alt="FunLab"/>
          </div>
          <span style={{fontWeight:800,fontSize:18}}><span style={{color:'#F47A8A'}}>Fun</span><span style={{color:'#6BB5E8'}}>Lab</span> <span style={{color:'#9B8FCF',fontSize:14,fontWeight:600}}>拼豆</span></span>
        </div>

        {/* Tabs */}
        <div style={{display:'flex',background:'#f2f1ee',borderRadius:10,padding:4,marginBottom:24}}>
          {['login','signup'].map(t=>(
            <button key={t} onClick={()=>setTab(t)} style={{
              flex:1,padding:'8px 0',border:'none',borderRadius:8,cursor:'pointer',fontFamily:'inherit',
              fontWeight:700,fontSize:13,transition:'all 0.15s',
              background: tab===t ? '#fff' : 'transparent',
              color: tab===t ? '#1A1A18' : '#888',
              boxShadow: tab===t ? '0 1px 4px rgba(0,0,0,0.1)' : 'none'
            }}>{t === 'login' ? 'Sign In' : 'Create Account'}</button>
          ))}
        </div>

        {/* Fields */}
        {['Email','Password'].map(f=>(
          <div key={f} style={{marginBottom:14}}>
            <label style={{display:'block',fontSize:12,fontWeight:600,color:'#555',marginBottom:6}}>{f}</label>
            <input
              type={f==='Password'?'password':'email'}
              value={f==='Email'?email:pass}
              onChange={e=>f==='Email'?setEmail(e.target.value):setPass(e.target.value)}
              placeholder={f==='Email'?'you@example.com':'••••••••'}
              style={{
                width:'100%',border:'2px solid #e8e6e1',borderRadius:8,padding:'10px 14px',
                fontSize:14,fontFamily:'inherit',outline:'none',
                transition:'border-color 0.15s', background:'#fafaf8'
              }}
              onFocus={e=>e.target.style.borderColor=tweaks.accentRed}
              onBlur={e=>e.target.style.borderColor='#e8e6e1'}
            />
          </div>
        ))}

        <button onClick={submit} disabled={loading} style={{
          width:'100%',marginTop:8,
          background:loading ? '#e8e6e1' : `linear-gradient(135deg, ${tweaks.accentRed}, ${tweaks.accentOrange})`,
          color: loading ? '#aaa' : '#fff',
          border:'none',borderRadius:10,padding:'13px 0',
          fontWeight:700,fontSize:14,cursor:loading?'default':'pointer',fontFamily:'inherit',
          transition:'all 0.2s'
        }}>
          {loading ? 'Signing in…' : tab==='login' ? 'Sign In →' : 'Create Account →'}
        </button>

        <div style={{textAlign:'center',marginTop:16,fontSize:12,color:'#bbb'}}>
          Tip: use <span style={{fontFamily:'Space Mono,monospace',color:'#888'}}>admin@…</span> email for admin role
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const tweaks = useTweaks();
  const [page, setPage] = useState(() => localStorage.getItem('pc_page') || 'gallery');
  const [favIds, setFavIds] = useState(() => {
    try { return new Set(JSON.parse(localStorage.getItem('pc_favs') || '[]')); }
    catch { return new Set(); }
  });
  const [isLoggedIn, setIsLoggedIn] = useState(() => localStorage.getItem('pc_loggedin') === '1');
  const [isAdmin, setIsAdmin] = useState(() => localStorage.getItem('pc_admin') === '1');
  const [showLogin, setShowLogin] = useState(false);
  const [openPattern, setOpenPattern] = useState(null);

  useEffect(() => { localStorage.setItem('pc_page', page); }, [page]);
  useEffect(() => { localStorage.setItem('pc_favs', JSON.stringify([...favIds])); }, [favIds]);
  useEffect(() => { localStorage.setItem('pc_loggedin', isLoggedIn ? '1' : '0'); }, [isLoggedIn]);
  useEffect(() => { localStorage.setItem('pc_admin', isAdmin ? '1' : '0'); }, [isAdmin]);

  const onFave = (id) => {
    if (!isLoggedIn) { setShowLogin(true); return; }
    setFavIds(prev => {
      const next = new Set(prev);
      next.has(id) ? next.delete(id) : next.add(id);
      return next;
    });
  };

  const onLogin = (adminFlag) => {
    setIsLoggedIn(true);
    setIsAdmin(adminFlag);
  };

  const onLogout = () => {
    setIsLoggedIn(false);
    setIsAdmin(false);
    localStorage.removeItem('pc_loggedin');
    localStorage.removeItem('pc_admin');
  };

  return (
    <div style={{minHeight:'100vh', background: tweaks.bgColor}}>
      <Navbar
        page={page} setPage={setPage}
        isLoggedIn={isLoggedIn} isAdmin={isAdmin}
        onLoginClick={() => setShowLogin(true)}
        onLogout={onLogout}
        tweaks={tweaks}
      />

      {page === 'gallery' && (
        <GalleryPage
          patterns={PATTERNS} favIds={favIds} onFave={onFave}
          onOpen={setOpenPattern} tweaks={tweaks} isLoggedIn={isLoggedIn}
        />
      )}
      {page === 'favorites' && (
        <FavoritesPage
          patterns={PATTERNS} favIds={favIds} onFave={onFave}
          onOpen={setOpenPattern} tweaks={tweaks}
          isLoggedIn={isLoggedIn} onLoginClick={() => setShowLogin(true)}
        />
      )}
      {page === 'admin' && isAdmin && <AdminPage tweaks={tweaks}/>}

      {openPattern && (
        <BeadMapViewer
          pattern={openPattern} onClose={() => setOpenPattern(null)}
          tweaks={tweaks} isLoggedIn={isLoggedIn}
        />
      )}
      {showLogin && (
        <LoginModal onClose={() => setShowLogin(false)} onLogin={onLogin} tweaks={tweaks}/>
      )}

      <style>{`
        @keyframes spin { to { transform: rotate(360deg); } }
        input[type=range] { appearance: none; height:4px; background:#e8e6e1; border-radius:2px; outline:none; }
        input[type=range]::-webkit-slider-thumb { appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent,#E84545); cursor:pointer; }
      `}</style>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
